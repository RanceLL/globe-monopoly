        (seats ? `<div class="seats-mini">${seats}</div>` : '') + `<div class="pz-info"><span class="pill">遊戲天數 <b>${s.maxD} 天</b></span></div>`);
      setHTML(pzB, '');
      return;
    }
    if (s.st === 'over') {
      const W = s.ps[s.win];
      const rows = s.rank.map((i, k) => {
        const p = s.ps[i];
        return `<li><span class="no">${k + 1}</span>${av(p.ch)}<span>${esc(p.nick)}${p.out ? '（破產）' : ''}</span><span class="num">${money(s.worth[i])}</span></li>`;
      }).join('');
      const canReset = meIdx(s) >= 0;
      setHTML(pzA, `<h2 class="neon sm">${esc(W.nick)} 成為大富翁</h2><ol class="rank">${rows}</ol>`);
      setHTML(pzB, canReset ? `<button class="btn go" type="button" data-act="reset"${canSend() && !A.pending ? '' : ' disabled'}>回大廳再玩一局</button>` : '');
      return;
    }
    const P = s.ps[s.turn], mine = myTurn(s);
    const pills = [`<span class="pill">第 <b>${s.day}</b> 天，共 ${s.maxD} 天</span>`, `<span class="pill">大樂透 <b>${money(s.pot)}</b></span>`];
    if (s.boom) pills.push(`<span class="pill hot">${E.GROUP_NAME[s.boom.g]}觀光熱潮，還有 ${s.boom.d} 天</span>`);
    const sub = `${esc(chOf(P).n)}，現金 ${money(P.cash)}`;
    const last = s.log.length ? s.log[s.log.length - 1].s.map((g) => segHTML(g, s)).join('') : '';
    setHTML(pzA, `<h2 class="neon sm">環球大富翁</h2><div class="pz-info">${pills.join('')}</div>` +
      `<div class="who">${av(P.ch)}<div class="who-t"><div class="who-n">${esc(P.nick)}${mine ? '（你）' : ''}</div><div class="who-s">${sub}</div></div></div>`);
    setHTML(pzB, `<p class="prompt">${phasePrompt(s, mine)}</p>` +
      (mine ? `<div class="pz-acts">${actionButtons(s)}</div><div class="pz-tools">${toolButtons(s)}</div>` : '') +
      `<p class="last">${last}</p>`);
    if (A.vqLen === 0) setDice(s.dice);
  }

  // ---- 大廳 ----
  const LOBBY_HTML = `<header><h2 id="lobbyTitle">大廳</h2><span class="meta" id="lobbyCount"></span></header>
    <ul class="seats" id="seats"></ul>
    <form class="join" id="joinForm" autocomplete="off">
      <label class="fl" for="nick" id="nickLabel">你的暱稱</label>
      <input type="text" id="nick" maxlength="10" placeholder="最多 10 個字">
      <span class="fl">選一個角色</span>
      <div class="chars" id="chars"></div>
      <p class="chskill" id="chSkill"></p>
      <div class="row" style="margin-top:0"><button class="btn gold" type="submit" id="joinBtn">入座</button><button class="btn small ghost" type="button" data-act="leave" id="leaveSeat" hidden>離座</button></div>
    </form>
    <div class="cfg" id="cfgRow"></div>
    <div class="row" id="lobbyBtns"></div>
    <p class="hint" id="lobbyHint"></p>`;
  function renderLobby() {
    const s = A.s, sec = $('#lobbySec');
    const show = !!s && s.st === 'lobby';
    sec.hidden = !show;
    if (!show) { sec.dataset.built = ''; return; }
    const local = A.mode === 'local';
    const me = local ? -1 : meIdx(s);
    const seated = me >= 0;
    const ok = canSend() && !A.pending;
    if (sec.dataset.built !== A.mode) {
      sec.innerHTML = LOBBY_HTML;
      sec.dataset.built = A.mode;
      $('#nick').value = local ? '' : seated ? s.ps[me].nick : (store.get('globe-mono.nick') || '');
    }
    const myCh = seated ? s.ps[me].ch : -1;
    const takenBy = (i) => s.ps.find((p) => p.ch === i);
    if (A.selCh < 0 || (takenBy(A.selCh) && A.selCh !== myCh)) A.selCh = seated ? myCh : E.CHARS.findIndex((c, i) => !takenBy(i));
    $('#lobbyTitle').textContent = local ? '本機玩家' : '大廳';
    $('#lobbyCount').textContent = `${s.ps.length} / ${E.MAX_P} 人`;
    setHTML($('#seats'), s.ps.length ? s.ps.map((p, i) => {
      const canKick = canSend() && (local || (seated && i !== me));
      const kick = canKick ? `<button class="x-btn" type="button" data-act="kick" data-i="${i}" aria-label="請 ${esc(p.nick)} 離座">×</button>` : '<span></span>';
      const tags = [];
      if (!local && i === me) tags.push('<span class="tag you">你</span>');
      if (p.bot) tags.push('<span class="tag">電腦</span>');
      if (!local && s.host === p.id) tags.push('<span class="tag">主持</span>');
      if (!local && !p.bot && !A.presentPids.has(p.id)) tags.push('<span class="tag">離線</span>');
      tags.push(vcBadge(p.id));
      return `<li class="prow" data-pid="${esc(p.id)}">${av(p.ch)}<div style="min-width:0"><div class="pn"><span>${esc(p.nick)}</span>${tags.join('')}</div><div class="ps">${esc(chOf(p).n)}，${esc(chOf(p).r)}</div></div>${kick}</li>`;
    }).join('') : '<li class="empty">還沒有人入座。</li>');
    const full = s.ps.length >= E.MAX_P;
    $('#joinForm').hidden = local ? full : (!seated && full);
    $('#nickLabel').textContent = local ? '玩家暱稱' : '你的暱稱';
    setHTML($('#chars'), E.CHARS.map((c, i) => {
      const taken = takenBy(i);
      const dis = !!taken && i !== myCh;
      return `<button class="chp" type="button" data-act="pickCh" data-ch="${i}" aria-pressed="${A.selCh === i}"${dis ? ' disabled' : ''}>${av(i)}<b>${esc(c.n)}</b><small>${dis ? esc(taken.nick) + ' 選了' : esc(c.r)}</small></button>`;
    }).join(''));
    const sel = E.CHARS[A.selCh];
    setHTML($('#chSkill'), sel ? `<b>${esc(sel.n)}的技能：</b>${esc(sel.x)}` : '');
    const jb = $('#joinBtn');
    jb.textContent = local ? '加入這位玩家' : seated ? '儲存變更' : '入座';
    jb.disabled = !ok || A.selCh < 0;
    $('#leaveSeat').hidden = local || !seated;
    const canCfg = ok && (local || seated);
    setHTML($('#cfgRow'), `<span>遊戲天數</span><div class="seg" role="radiogroup" aria-label="遊戲天數">${E.DAY_OPTS.map((v) => `<button type="button" role="radio" aria-checked="${s.maxD === v}" data-act="cfg" data-v="${v}"${canCfg ? '' : ' disabled'}>${v} 天</button>`).join('')}</div>`);
    let btns = '';
    if ((local || seated) && s.ps.length < E.MAX_P) btns += `<button class="btn small" type="button" data-act="addBot"${ok ? '' : ' disabled'}>加電腦玩家</button>`;
    if (A.mode === 'online') btns += '<button class="btn small" type="button" data-act="invite">邀請朋友</button>';
    if ((local || seated) && s.ps.length >= 2) btns += `<button class="btn go" type="button" data-act="start"${ok ? '' : ' disabled'}>開始遊戲</button>`;
    setHTML($('#lobbyBtns'), btns);
    $('#lobbyHint').textContent = s.ps.length < 2 ? '至少 2 位玩家才能開始，可以加電腦玩家湊人數。' : local ? '大家輪流用這台裝置，輪到誰誰來按。' : '任何一位已入座的玩家都可以按「開始遊戲」。';
  }

  // ---- 錢包 ----
  function statusChips(s, P, withText) {
    const out = [];
    if (P.god) {
      const g = E.GODS[P.god.k];
      out.push(`<span class="chip ${g.good ? 'good' : 'bad'}" title="${esc(g.x)}">${ART.icon(P.god.k)}${g.n}${withText ? ` 剩 ${P.god.d} 回合` : ` ${P.god.d}`}</span>`);
    }
    if (P.jail > 0) out.push(`<span class="chip plain bad">坐牢 ${P.jail} 天</span>`);
    if (P.hosp > 0) out.push(`<span class="chip plain bad">住院 ${P.hosp} 天</span>`);
    if (P.turtle > 0) out.push(`<span class="chip plain">烏龜 ${P.turtle}</span>`);
    if (P.dir < 0) out.push('<span class="chip plain">倒著走</span>');
    if (P.auto) out.push('<span class="chip plain">託管中</span>');
    return out.join('');
  }
  function renderWallet() {
    const s = A.s, sec = $('#walletSec');
    const me = meIdx(s);
    const show = !!s && (s.st === 'play' || s.st === 'over') && me >= 0;
    sec.hidden = !show;
    if (!show) return;
    const P = s.ps[me], c = chOf(P);
    const worth = E.netWorth(s, me);
    const stv = E.stockValue(s, P);
    const gain = stv - P.stk.reduce((t, n, k) => t + E.costOf(P, k), 0);
    const auto = s.st === 'play' && !P.out ? `<label class="hint" style="display:flex;align-items:center;gap:8px;margin-top:12px"><input type="checkbox" data-act="auto"${P.auto ? ' checked' : ''}${canSend() && !A.pending ? '' : ' disabled'}> 託管（交給電腦代打）</label>` : '';
    const isStarter = s.starter === (A.mode === 'local' ? P.id : A.myPid);
    const ext = s.st === 'play' && !P.out ? `<div class="row"><button class="btn small" type="button" data-act="openBank"${canAct() ? '' : ' disabled'}>存款、提款</button>` +
      `<button class="btn small ghost" type="button" data-act="resign"${canSend() && !A.pending ? '' : ' disabled'}>認輸</button>` +
      (isStarter ? `<button class="btn small ghost" type="button" data-act="endGame"${canSend() && !A.pending ? '' : ' disabled'}>提前結算</button>` : '') + '</div>' : '';
    setHTML(sec, `<div class="w-top">${av(P.ch)}<div style="min-width:0"><div class="w-name">${esc(P.nick)}${A.mode === 'local' ? '' : '（你）'}</div><div class="w-role">${esc(c.n)}，${esc(c.r)}</div></div></div>` +
      `<p class="w-cash">${money(P.cash)}<small>現金</small></p>` +
      `<div class="w-row"><div><span>存款</span><b>${money(P.dep)}</b></div><div><span>點數</span><b>${P.pts}</b></div><div><span>總資產</span><b>${money(worth)}</b></div></div>` +
      (stv ? `<p class="hint" style="margin-top:8px">股票市值 ${money(stv)}，帳面損益${gainTxt(gain)}</p>` : '') +
      `<div class="chips">${statusChips(s, P, true)}</div>` +
      `<p class="skill"><b>技能：</b>${esc(c.x)}${P.bankOk && s.turn === me ? '　這回合經過銀行，提款免手續費。' : ''}</p>` + ext + auto);
  }

  // ---- 手牌 ----
  function cardTile(s, i, c, k) {
    const C = E.CARDS[c], cat = CAT[CAT_OF[c]];
    const err = i >= 0 && s.st === 'play' && s.turn === i ? E.cardReady(s, i, c) : '還沒輪到你';
    const usable = !err && canAct();
    return `<button class="hcard${usable ? '' : ' off'}" type="button" data-act="openCard" data-c="${c}" data-k="${k}" style="--cc:${cat.c}" title="${esc(C.x)}"><span class="ct">${cat.n}</span><b>${esc(C.n)}</b><small>${esc(C.w === 'auto' ? '自動生效' : C.w === 'pre' ? '擲骰前使用' : '自己回合隨時可用')}</small></button>`;
  }
  function renderHand() {
    const s = A.s, sec = $('#handSec');
    const me = meIdx(s);
    const show = !!s && s.st === 'play' && me >= 0 && !s.ps[me].out;
    sec.hidden = !show;
    if (!show) return;
    const P = s.ps[me];
    setHTML(sec, `<header><h2>手牌</h2><span class="meta">${P.cards.length} / ${E.MAX_CARDS} 張，點數 ${P.pts}</span></header>` +
      (P.cards.length ? `<div class="hand">${P.cards.map((c, k) => cardTile(s, me, c, k)).join('')}</div>` : '<p class="empty">還沒有卡片。停在卡片屋可以用點數買卡。</p>') +
      `<p class="hint">每回合可以用一張卡片。免費卡、免罪卡會在需要時自動生效。</p>`);
  }

  // ---- 股市 ----
  const gainTxt = (g) => ` <span class="${g > 0 ? 'up' : g < 0 ? 'down' : ''}">${g > 0 ? '+' : g < 0 ? MINUS : ''}${money(Math.abs(g))}</span>`;
  function holdCell(P, k) {
    const held = P ? P.stk[k] : 0;
    if (!held) return '<span class="sh"></span>';
    const avg = E.avgCost(P, k);
    return `<span class="sh"><b>${held} 股</b>${avg ? `<small>均價 ${avg.toFixed(1)}</small>` : ''}</span>`;
  }
  function renderStocks() {
    const s = A.s, sec = $('#stockSec');
    const show = !!s && s.st === 'play';
    sec.hidden = !show;
    if (!show) return;
    const me = meIdx(s);
    const P = me >= 0 ? s.ps[me] : null;
    setHTML(sec, `<header><h2>股市</h2><span class="meta">每天開盤時漲跌</span></header><div class="stks">${s.stk.map((st, k) => {
      const ch = st.o ? st.p / st.o - 1 : 0;
      const held = P ? P.stk[k] : 0;
      return `<button class="srow" type="button" data-act="openTrade" data-k="${k}"><span class="sn">${esc(E.STOCKS[k].n)}</span>${sparkSVG(st.h.concat(st.p !== st.h[st.h.length - 1] ? [st.p] : []), 58, 22, 'spark')}` +
        `<span><span class="sp" style="display:block">${st.p.toFixed(1)}</span><span class="sc ${ch > 0 ? 'up' : ch < 0 ? 'down' : ''}" style="display:block">${pct(ch)}</span></span>${holdCell(P, k)}</button>`;
    }).join('')}</div><p class="stk-note">紅色是漲、綠色是跌。均價是你買進的平均價格。買賣收 1% 手續費，工程師免收。</p>`);
  }

  // ---- 玩家 ----
  function renderPax() {
    const s = A.s, sec = $('#paxSec');
    const show = !!s && s.st !== 'lobby';
    sec.hidden = !show;
    if (!show) return;
    const me = meIdx(s);
    const alive = s.ps.filter((p) => !p.out).length;
    setHTML(sec, `<header><h2>玩家</h2><span class="meta">${alive} 人還在場上</span></header><ul class="plist">${s.ps.map((p, i) => {
      const tags = [];
      if (A.mode !== 'local' && i === me) tags.push('<span class="tag you">你</span>');
      if (p.bot) tags.push('<span class="tag">電腦</span>');
      if (p.out) tags.push('<span class="tag red">破產</span>');
      if (A.mode === 'online' && !p.bot && !p.out && !A.presentPids.has(p.id)) tags.push('<span class="tag">離線</span>');
      if (A.mode === 'online' && s.host === p.id) tags.push('<span class="tag">主持</span>');
      tags.push(vcBadge(p.id));
      const cities = Object.keys(s.own).filter((q) => s.own[q].o === i).length;
      return `<li class="prow${s.st === 'play' && s.turn === i ? ' cur' : ''}${p.out ? ' out' : ''}" data-pid="${esc(p.id)}">${av(p.ch)}<div style="min-width:0"><div class="pn"><span>${esc(p.nick)}</span>${tags.join('')}</div>` +
        `<div class="ps">${esc(chOf(p).n)}，${cities} 座城市，${p.cards.length} 張卡${statusChips(s, p, false)}</div></div>` +
        `<div class="pm"><b>${money(p.cash)}</b><span>總資產 ${money(E.netWorth(s, i))}</span></div></li>`;
    }).join('')}</ul>`);
  }
  function renderLog() {
    const s = A.s, sec = $('#logSec');
    sec.hidden = !s;
    if (!s) return;
    const items = s.log.slice(-50).reverse();
    setHTML($('#log'), items.length ? items.map((e) => `<li>${e.s.map((g) => segHTML(g, s)).join('')}</li>`).join('') : '<li>還沒有動靜。</li>');
    const newest = s.log[s.log.length - 1];
    if (newest && newest.k !== A.lastLogK) {
      if (A.lastLogK) $('#live').textContent = newest.s.map((g) => segText(g, s)).join('');
      A.lastLogK = newest.k;
    }
  }
  function renderDock() {
    const s = A.s, dock = $('#dock');
    const show = !!s && s.st === 'play' && myTurn(s) && canSend();
    dock.hidden = !show;
    document.body.classList.toggle('docked', show);
    if (!show) return;
    setHTML(dock, `<div class="d-msg">${phasePrompt(s, true)}</div><div class="d-acts">${actionButtons(s)}</div><div class="d-tools">${toolButtons(s)}</div>`);
  }

  // ---------- 對話框 ----------
  function openDlg(kind, arg) {
    A.dlg = { kind, arg };
    A.sel = null;
    renderDlg(true);
    $('#dlgBg').hidden = false;
    const f = $('#dlg [data-focus]') || $('#dlg .x-close');
    if (f) f.focus();
  }
  function closeDlg() {
    const d = A.dlg;
    A.dlg = null;
    $('#dlgBg').hidden = true;
    if (d && d.kind === 'shop' && A.s && A.s.ph === 'shop' && myTurn()) submit({ t: 'shopDone' });
  }
  function autoDialogs() {
    const s = A.s;
    const shopNow = !!s && s.st === 'play' && s.ph === 'shop' && myTurn(s) && canSend();
    if (shopNow && !busy() && !A.popOpen && (!A.dlg || A.dlg.kind !== 'shop') && A.shopShownK !== s.ver) {
      if (!A.dlg || ['hand', 'market', 'trade', 'deed'].includes(A.dlg.kind)) { A.shopShownK = s.ver; openDlg('shop'); }
    }
    if (A.dlg && A.dlg.kind === 'shop' && !shopNow) { A.dlg = null; $('#dlgBg').hidden = true; }
    if (A.dlg && ['card', 'bank'].includes(A.dlg.kind) && !(s && s.st === 'play')) { A.dlg = null; $('#dlgBg').hidden = true; }
  }
  function renderDlg(first) {
    const d = A.dlg;
    if (!d) return;
    const el = $('#dlg');
    const html = dlgHTML(d);
    if (!html) { A.dlg = null; $('#dlgBg').hidden = true; return; }
    if (el._h === html) return;
    // 重畫時保留輸入框的內容與焦點
    const keep = {};
    let focusId = null;
    el.querySelectorAll('input[id]').forEach((inp) => { keep[inp.id] = inp.value; });
    if (document.activeElement && el.contains(document.activeElement) && document.activeElement.id) focusId = document.activeElement.id;
    el.innerHTML = html;
    el._h = html;
    if (!first) {
      Object.keys(keep).forEach((id) => { const inp = el.querySelector('#' + id); if (inp) inp.value = keep[id]; });
      if (focusId) { const f = el.querySelector('#' + focusId); if (f) f.focus(); }
    }
    dlgNotes();
  }
  const xBtn = '<button class="x-btn x-close" type="button" data-act="closeDlg" aria-label="關閉">×</button>';
  // 銀行、股票視窗裡，依照輸入的金額或股數即時試算
  function dlgNotes() {
    const s = A.s;
    const me = s ? meIdx(s) : -1;
    const P = me >= 0 ? s.ps[me] : null;
    const lines = (arr) => arr.map((t) => `<span style="display:block">${t}</span>`).join('');
    const bn = $('#bankNote'), bi = $('#bankAmt');
    if (bn && bi && P) {
      const v = parseInt(bi.value || '0', 10);
      let t = [];
      if (v > 0) {
        if (v > P.dep) t.push(`存款只有 ${money(P.dep)}，不夠領 ${money(v)}。`);
        else {
          const fee = E.wdFee(P, v);
          t.push(fee ? `領出 ${money(v)}：手續費 ${money(fee)}，實拿 ${money(v - fee)}。` : `領出 ${money(v)}：免手續費。`);
        }
      }
      setHTML(bn, lines(t));
    }
    const tn = $('#tradeNote'), ti = $('#tradeQty');
    const k = A.dlg && A.dlg.kind === 'trade' ? A.dlg.arg : null;
    if (tn && ti && P && k != null && s.stk[k]) {
      const q = parseInt(ti.value || '0', 10), price = s.stk[k].p, held = P.stk[k];
      const t = [];
      if (q > 0) {
        const cost = Math.round(price * q), fee = E.stockFee(P, cost);
        t.push(`買進 ${q} 股：${money(cost)}${fee ? `，加手續費 ${money(fee)}，共 ${money(cost + fee)}` : ''}。`);
        const left = P.cash - cost - fee;
        if (left >= 0 && left < 2000) t.push(`買完現金只剩 ${money(left)}。之後付不出錢時，會先動用存款，再自動賣掉一部分股票。`);
        if (held && q <= held) {
          const got = Math.round(price * q), sfee = E.stockFee(P, got);
          const gain = got - sfee - Math.round(E.costOf(P, k) * q / held);
          t.push(`賣出 ${q} 股：拿回 ${money(got - sfee)}，${gain >= 0 ? '賺' : '賠'} ${money(Math.abs(gain))}。`);
        } else if (held) t.push(`你只有 ${held} 股可以賣。`);
      }
      setHTML(tn, lines(t));
    }
  }
  function dlgHTML(d) {
    const s = A.s;
    switch (d.kind) {
      case 'rules': return rulesHTML();
      case 'invite': return inviteHTML();
      case 'deed': return deedHTML(d.arg);
      case 'hand': return handDlgHTML();
      case 'card': return cardDlgHTML(d.arg);
      case 'shop': return s && s.st === 'play' ? shopHTML() : '';
      case 'bank': return s && s.st === 'play' ? bankHTML() : '';
      case 'market': return s && s.st === 'play' ? marketHTML() : '';
      case 'trade': return s && s.st === 'play' ? tradeHTML(d.arg) : '';
      default: return '';
    }
  }
  function rulesHTML() {

  // ---------- 狀態更新 ----------
  function setState(ns) {

    recomputePresence();

    renderAll();
    scheduleBot();
    // 開局和結算時，把棋盤捲回畫面裡（手機上按鈕在下方，按完常常看不到棋盤）

  function sanitizeAct(a) {

  }
  function hostProcess(pid, act) {
    const s = A.s;

    const r = E.apply(s, pid, sanitizeAct(act));

    if (!r.ok) ns.ver = s.ver + 1;

  }

  // ---------- 電腦代打 ----------

    if (!needsAuto(s.ps[s.turn])) return;
    const wait = Math.max(700, A.visualBusyUntil - Date.now() + 450);

  }
  // 背景分頁的計時器會被瀏覽器放慢，所以主持人收到別人的訊息時也會推進電腦回合
  function maybeBot() {
    const s = A.s;

    if (!needsAuto(s.ps[s.turn])) return;

  }
  function botTick() {
    const s = A.s;
    if (!s || s.st !== 'play') return;
    if (A.mode !== 'local' && !isHostNow()) return;
    const cur = s.ps[s.turn];
    if (!needsAuto(cur)) return;
    if (Date.now() < A.visualBusyUntil || A.vqLen > 0 || A.popOpen) { scheduleBot(); return; }
    const a = E.botAct(s);
    if (!a) return;
    let r = E.apply(s, cur.id, a);
    if (!r.ok) {
      const fb = { roll: { t: 'roll' }, end: { t: 'end' }, stay: { t: 'end' }, buy: { t: 'pass' }, up: { t: 'pass' }, shop: { t: 'shopDone' } }[s.ph];
      if (fb) r = E.apply(s, cur.id, fb);

  }

  // ---------- 在線狀態與主持人 ----------
  function topic(k) { return `${TOPIC_ROOT}/${A.room}/${k}`; }
  function announce() {
    if (!A.client || !A.connected) return;

  }
  function onWho(pid, tab, txt) {
    if (!SAFE_ID.test(pid) || !SAFE_ID.test(tab)) return;
    const key = pid + '/' + tab;
    if (!txt) delete A.tabs[key]; else A.tabs[key] = { pid, at: Date.now() };

  }
  function recomputePresence() {
    const now = Date.now(), set = new Set();
    for (const k in A.tabs) { if (now - A.tabs[k].at < PRESENCE_TTL) set.add(A.tabs[k].pid); else delete A.tabs[k]; }

  }
  function trackAbsence() {
    const s = A.s;

    const now = Date.now();
    s.ps.forEach((p) => {
      if (p.bot || p.out) return;

  }
  function checkHost() {
    const s = A.s;

    if (!A.hostGoneAt) { A.hostGoneAt = Date.now(); return; }
    if (Date.now() - A.hostGoneAt < HOST_GONE_MS) return;
    // 在線的分頁裡，按「身分/分頁」排序，優先選還在局裡的真人玩家
    const keys = [...new Set([...Object.keys(A.tabs), myKey()])].sort();
    const inGame = (k) => s.ps.some((p) => p.id === k.split('/')[0] && !p.bot && !p.out);
    const seated = keys.filter(inGame);
    const pick = (seated.length ? seated : keys)[0];
    if (pick !== myKey()) return;
    const ns = E.clone(s);
    ns.ver = s.ver + 1;
    ns.host = A.myPid;
    ns.hostTab = A.tab;
    const me = ns.ps.find((p) => p.id === A.myPid);
    E.log(ns, (me ? me.nick : '一位旁觀者') + ' 接手主持牌局');
    A.hostGoneAt = 0;
    commit(ns);
    announce();
  }
  function housekeeping() {
    const s = A.s;
    recomputePresence();
    trackAbsence();
    checkHost();
    if (A.mode === 'online' && A.connected && Date.now() - A.lastAnnounce > 20000) announce();
    if (isHostNow()) maybeBot();
    // 電腦或離線玩家的回合時，前景頁面定時提醒主持人，切到背景的主持人頁面也能及時推進
    if (A.mode === 'online' && A.client && A.connected && !isHostNow() && s && s.st === 'play' && document.visibilityState === 'visible') {
      const cur = s.ps[s.turn];
      if (cur && (cur.bot || cur.auto || !A.presentPids.has(cur.id)) && Date.now() - A.lastStateAt > 2500 && Date.now() - A.lastTick > 2500) {
        A.lastTick = Date.now();
        A.client.publish(topic('act'), JSON.stringify({ pid: A.myPid, tick: 1 }), { qos: 0 });
      }
    }
    if (A.pending && Date.now() - A.pending.at > 15000) { A.pending = null; toast('主持人沒有回應，請稍後再試', 'bad'); renderAll(); }
    renderTop();
    renderNotice();
    if (A.mode === 'online' && !A.s) renderPlaza();
    scheduleBot();
  }

  // ---------- 送出操作 ----------
  function submit(a) {
    if (A.mode === 'local') { submitLocal(a); return; }
    if (A.mode !== 'online') return;
    const s = A.s;
    if (!s || A.pending) return;
    const n = Math.max(A.sentN, (s.seen && s.seen[A.myPid]) || 0) + 1;
    A.sentN = n;
    const act = Object.assign({}, a, { n, pid: A.myPid });
    A.pending = { n, at: Date.now() };
    if (isHostNow()) { hostProcess(A.myPid, act); return; }
    if (!A.client || !A.connected) { A.pending = null; toast('還沒連上伺服器，請稍等', 'bad'); return; }
    A.client.publish(topic('act'), JSON.stringify(act), { qos: 1 }, (err) => {
      if (err && A.pending && A.pending.n === n) { A.pending = null; toast('操作沒有送出去，請再試一次', 'bad'); renderAll(); }
    });

  }
  function submitLocal(a) {
    const s = A.s;
    if (!s) return;
    let actor = A.myPid;
    if (s.st === 'play') {
      const me = meIdx(s);
      if (me >= 0) actor = s.ps[me].id;
    } else if (s.st === 'lobby') {
      if (a.t === 'join') actor = 'local-' + randId();
      else { const h = s.ps.find((p) => !p.bot); if (h) actor = h.id; }
    } else if (s.st === 'over') {
      const h = s.ps.find((p) => !p.bot);
      if (h) actor = h.id;
    }
    const r = E.apply(s, actor, a);
    if (!r.ok) { toast(r.err, 'bad'); return; }
    if (a.t === 'join') A.lastLocal = actor;
    commit(r.s);
  }

  // ---------- 房間連線 ----------
  function onMessage(t, buf) {
    const base = `${TOPIC_ROOT}/${A.room}/`;
    if (!t.startsWith(base)) return;
    const rest = t.slice(base.length);
    let txt = '';
    try { txt = buf && buf.length ? new TextDecoder().decode(buf) : ''; } catch (e) { return; }
    if (rest === 'state') {
      if (!txt) return;
      let d;
      try { d = JSON.parse(txt); } catch (e) { return; }
      onState(d);
    } else if (rest === 'act') {
      let a;
      try { a = JSON.parse(txt); } catch (e) { return; }
      if (!a || typeof a !== 'object' || typeof a.pid !== 'string' || !SAFE_ID.test(a.pid) || !isHostNow()) return;
      if (a.tick) { maybeBot(); return; }
      hostProcess(a.pid, a);
    } else if (rest.startsWith('rtc/')) {
      if (rest === 'rtc/' + myKey()) vcOnSignal(txt);
    } else if (rest.startsWith('who/')) {
      const parts = rest.split('/');
      if (parts.length === 3) onWho(parts[1], parts[2], txt);
    }
  }
  function onState(d) {
    if (!d || typeof d !== 'object' || !Array.isArray(d.ps) || d.v !== 3 || !Number.isInteger(d.ver)) return;
    A.synced = true;
    A.noTable = false;
    clearTimeout(A.syncTimer);
    const cur = A.s;
    if (cur && cur.tid === d.tid && d.ver <= cur.ver) {
      // 同時有兩位主持人時，「身分/分頁」排在前面的那位說了算
      if (isHostNow() && d.host && hostKey(d) !== myKey() && hostKey(d) < myKey()) setState(d);
      return;
    }
    setState(d);
  }
  function resetRoomState() {
    A.s = null; A.synced = false; A.noTable = false; A.connected = false; A.connLostAt = 0; A.tabs = {};
    A.presentPids = new Set(); A.hostOnline = false; A.pending = null; A.sentN = 0;
    A.hostGoneAt = 0; A.absentSince = {}; A.lastLogK = 0; A.visualReady = false; A.libMissing = false; A.selCh = -1;
    clearTimeout(A.botTimer); A.botTimer = null;
    $('#lobbySec').dataset.built = '';
    if (A.dlg && !['rules'].includes(A.dlg.kind)) { A.dlg = null; $('#dlgBg').hidden = true; }
    if (A.popClose) A.popClose();
    clearTokens();
    cells.forEach((el) => { el._k = null; el._lv = null; el._item = null; });
  }
  function leaveRoom() {
    vcLeave();
    const c = A.client;
    A.client = null;
    clearTimeout(A.syncTimer);
    if (c) {
      try { if (c.connected) c.publish(topic(`who/${A.myPid}/${A.tab}`), '', { qos: 0, retain: true }); } catch (e) { /* 略過 */ }
      try { c.end(false); } catch (e) { /* 略過 */ }

  }
  function connectRoom(room, bIdx, creating) {
    leaveRoom();
    resetRoomState();
    A.mode = 'online'; A.room = room; A.broker = bIdx; A.creating = !!creating; A.connStart = Date.now();
    if (!window.mqtt) { A.libMissing = true; renderAll(); return; }
    renderAll();
    const client = window.mqtt.connect(BROKERS[bIdx], {
      clientId: 'gm2_' + randId(), clean: true, keepalive: 30, reconnectPeriod: 2500, connectTimeout: 12000,
      will: { topic: topic(`who/${A.myPid}/${A.tab}`), payload: '', retain: true, qos: 1 },
    });
    A.client = client;
    client.on('connect', () => {
      if (A.client !== client) return;
      A.connected = true;
      A.connLostAt = 0;
      A.synced = false;
      client.subscribe([topic('state'), topic('act'), topic('who/+/+'), topic('rtc/' + A.myPid + '/' + A.tab)], { qos: 1 }, (err) => {
        if (A.client !== client) return;

    if (creating && bIdx + 1 < BROKERS.length) {

  }
  function roomHash(room, b) { return 'r=' + room + (b ? '&b=' + b : ''); }
  function parseHash() {
    const p = new URLSearchParams(location.hash.replace(/^#/, ''));
    const room = (p.get('r') || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12);
    let b = parseInt(p.get('b') || '0', 10);

  function inviteLink() { return location.origin + location.pathname + '#' + roomHash(A.room, A.broker); }

  function newRoomCode() {

  }
  function createRoom() {
    if (!window.mqtt) { toast('即時連線元件沒有載入成功，請重新整理頁面', 'bad'); return; }

    A.pendingCreate = code;
    location.hash = roomHash(code, 0);
  }

  }

    }
  }
  function bindUI() {
    document.addEventListener('click', (ev) => {
      const t = ev.target.closest('[data-act]');
      if (!t || t.disabled) return;
      if (t.tagName === 'INPUT') return;
      handleAct(t.dataset.act, t);
    });
    document.addEventListener('input', (ev) => {
      const id = ev.target && ev.target.id;
      if (id === 'bankAmt' || id === 'tradeQty') dlgNotes();
    });
    document.addEventListener('change', (ev) => {
      const t = ev.target;
      if (t && t.dataset && t.dataset.act === 'auto') submit({ t: 'auto', on: !!t.checked });
    });
    $('#dlgBg').addEventListener('click', (ev) => { if (ev.target === ev.currentTarget) closeDlg(); });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') {
        if (A.popOpen && A.popClose) A.popClose();
        else if (!$('#dlgBg').hidden) closeDlg();
        return;
      }
      const t = ev.target;
      if ((ev.key === 'Enter' || ev.key === ' ') && t.classList && t.classList.contains('cell')) {
        ev.preventDefault();
        handleAct('deed', t);
      }
    });
    document.addEventListener('submit', (ev) => {
      ev.preventDefault();
      if (ev.target.id === 'joinRoomForm') {
        const code = String($('#roomCode').value || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12);
        if (code.length < 4) { toast('房間號碼不對，請再檢查一下', 'bad'); return; }
        location.hash = roomHash(code, 0);
      } else if (ev.target.id === 'joinForm') {
        const nick = E.cleanNick($('#nick').value);
        if (!nick) { toast('請先填寫暱稱', 'bad'); $('#nick').focus(); return; }
        const ch = A.selCh;
        if (ch < 0) { toast('請選一個角色', 'bad'); return; }
        if (A.mode === 'local') { $('#nick').value = ''; A.selCh = -1; }
        else store.set('globe-mono.nick', nick);
        submit({ t: 'join', nick, ch });
      }
    });
    let rt = 0;
    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (A.vqLen === 0) layoutTokens(A.s); }, 120); });
    window.addEventListener('hashchange', route);
    window.addEventListener('pagehide', () => {
      if (A.client && A.connected) { try { A.client.publish(topic(`who/${A.myPid}/${A.tab}`), '', { qos: 0, retain: true }); } catch (e) { /* 略過 */ } }
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && A.mode === 'online') { announce(); housekeeping(); } });
  }
  // ---------- 即時語音（WebRTC 點對點，連線訊號透過同一個房間的 MQTT 轉送） ----------
  const ICE = [
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
    { urls: 'stun:stun.cloudflare.com:3478' },
  ];
  const MIC = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const MIC_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" opacity=".55"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  const VC_SLOW = 12000;   // 超過這麼久還沒連上，發起方重新連線
  const VC_FLAG = 20000;   // 重新連線後還是不通，才在名單上標示「語音連不上」
  const VC = {
    on: false, joining: false, muted: false, listenOnly: false, stream: null, ctx: null,
    peers: {}, remote: {}, meters: {}, talk: new Set(), heard: {}, timer: null, blocked: false, watchAt: 0,
    flag() { return this.on ? (this.muted || this.listenOnly ? 2 : 1) : 0; },
  };
  const keyOk = (k) => typeof k === 'string' && /^[A-Za-z0-9_-]{1,40}\/[A-Za-z0-9_-]{1,40}$/.test(k);
  const sidOk = (s) => typeof s === 'string' && /^[A-Za-z0-9_-]{1,24}$/.test(s);
  const pidOfKey = (k) => k.split('/')[0];
  // 每一對玩家之間，鍵值小的一方負責發起連線（也負責重新連線）
  const vcStarter = (key) => myKey() < key;
  function vcSig(to, sid, payload) {
    if (!A.client || !A.connected) return;
    A.client.publish(topic('rtc/' + to), JSON.stringify(Object.assign({ f: myKey(), s: sid }, payload)), { qos: 1 });
  }
  function vcMeter(key, stream) {
    if (!VC.ctx || !stream || !stream.getAudioTracks().length) return;
    try {
      const src = VC.ctx.createMediaStreamSource(stream);
      const an = VC.ctx.createAnalyser();
      an.fftSize = 512;
      src.connect(an);
      VC.meters[key] = { an, src, buf: new Uint8Array(an.fftSize) };
    } catch (e) { console.warn('音量偵測失敗', e); }
  }
  function vcDropMeter(key) {
    const m = VC.meters[key];
    if (m) { try { m.src.disconnect(); } catch (e) { /* 略過 */ } delete VC.meters[key]; }
  }
  // 建立一條連線。sid 是這一次連線的編號，對方回傳的訊號會帶著它，舊連線留下的訊號就能被認出來丟掉。
  // carry 用來在重新連線時，延續「從什麼時候開始連不上」與重試次數。
  function vcPeer(key, sid, carry) {
    if (VC.peers[key]) return VC.peers[key];
    const now = Date.now();
    const pc = new RTCPeerConnection({ iceServers: ICE });
    const peer = {
      key, pc, sid: sid || randId(), polite: !vcStarter(key), makingOffer: false, ignoreOffer: false, audio: null,
      state: carry && carry.state === 'failed' ? 'failed' : 'connecting', t0: now, since: (carry && carry.since) || now, tries: (carry && carry.tries) || 0,
    };
    VC.peers[key] = peer;
    if (VC.stream) VC.stream.getTracks().forEach((t) => pc.addTrack(t, VC.stream));
    else if (!peer.polite) pc.addTransceiver('audio', { direction: 'recvonly' });
    pc.onnegotiationneeded = async () => {
      try {
        peer.makingOffer = true;
        await pc.setLocalDescription();
        vcSig(key, peer.sid, { d: pc.localDescription });
      } catch (e) { console.warn('語音協商失敗', e); } finally { peer.makingOffer = false; }
    };
    pc.onicecandidate = (ev) => { if (ev.candidate) vcSig(key, peer.sid, { c: ev.candidate }); };
    pc.ontrack = (ev) => {
      const stream = (ev.streams && ev.streams[0]) || new MediaStream([ev.track]);
      if (!peer.audio) {
        peer.audio = document.createElement('audio');
        peer.audio.autoplay = true;
        peer.audio.setAttribute('playsinline', '');
        $('#vaudio').appendChild(peer.audio);
      }
      if (peer.audio.srcObject !== stream) {
        peer.audio.srcObject = stream;
        vcDropMeter(key);
        vcMeter(key, stream);
      }
      const pr = peer.audio.play();
      if (pr && pr.catch) pr.catch(() => { if (VC.peers[key] === peer) { VC.blocked = true; vcRender(); } });
    };
    pc.onconnectionstatechange = () => {
      if (VC.peers[key] !== peer) return;
      if (pc.connectionState === 'connected') {
        peer.state = 'connected';
        peer.since = 0;
        peer.tries = 0;
      } else if (!peer.since) peer.since = Date.now();
      vcRender();
    };
    return peer;
  }
  function vcClosePeer(key) {
    const peer = VC.peers[key];
    if (!peer) return;
    delete VC.peers[key];
    try { peer.pc.close(); } catch (e) { /* 略過 */ }
    if (peer.audio) { peer.audio.srcObject = null; peer.audio.remove(); }
    vcDropMeter(key);
  }
  // 看門狗：連不上的連線由發起方重新連線（前三次每 12 秒一次，之後每分鐘一次），一直不通才標示出來
  function vcWatch(now) {
    let changed = false;
    Object.values(VC.peers).forEach((peer) => {
      if (peer.pc.connectionState === 'connected') return;
      if (!peer.since) peer.since = now;
      if (now - peer.since >= VC_FLAG && peer.state !== 'failed') { peer.state = 'failed'; changed = true; }
      const wait = peer.tries < 3 ? VC_SLOW : 60000;
      if (!peer.polite && now - peer.since >= VC_SLOW && now - peer.t0 > wait) {
        const carry = { since: peer.since, tries: peer.tries + 1, state: peer.state };
        vcClosePeer(peer.key);
        vcPeer(peer.key, null, carry);
        changed = true;
      }
    });
    if (changed) vcRender();
  }
  async function vcOnSignal(txt) {
    let m;
    try { m = JSON.parse(txt); } catch (e) { return; }
    if (!m || !keyOk(m.f) || m.f === myKey() || !sidOk(m.s)) return;
    const isOffer = !!(m.d && m.d.type === 'offer');
    if (!VC.on) { if (isOffer) vcSig(m.f, m.s, { bye: 1 }); return; }
    let peer = VC.peers[m.f];
    if (m.bye) { if (peer && peer.sid === m.s) { vcClosePeer(m.f); vcRender(); } return; }
    if (!peer || peer.sid !== m.s) {
      // 對方開了新的一次連線：換掉舊的。其他不屬於目前連線的訊號一律丟掉。
      if (!isOffer) return;
      if (peer && !peer.polite) return;
      const carry = peer && peer.pc.connectionState !== 'connected' ? { since: peer.since, state: peer.state } : null;
      vcClosePeer(m.f);
      peer = vcPeer(m.f, m.s, carry);
    }
    const pc = peer.pc;
    try {
      if (m.d && (m.d.type === 'offer' || m.d.type === 'answer') && typeof m.d.sdp === 'string') {
        const collision = isOffer && (peer.makingOffer || pc.signalingState !== 'stable');
        peer.ignoreOffer = !peer.polite && collision;
        if (peer.ignoreOffer) return;
        await pc.setRemoteDescription(m.d);
        if (isOffer) { await pc.setLocalDescription(); vcSig(m.f, peer.sid, { d: pc.localDescription }); }
      } else if (m.c && typeof m.c === 'object') {
        try { await pc.addIceCandidate(m.c); } catch (e) { if (!peer.ignoreOffer) console.warn('ICE 候選加入失敗', e); }
      }
    } catch (e) { console.warn('語音訊號處理失敗', e); }
  }
  // 從在線名單得知誰開了語音
  function vcOnWho(pid, tab, txt) {
    const key = pid + '/' + tab;
    if (key === myKey()) return;
    let flag = 0;
    if (txt) { try { flag = (JSON.parse(txt) || {}).vc || 0; } catch (e) { flag = 0; } }
    flag = flag === 1 || flag === 2 ? flag : 0;
    if (flag) VC.remote[key] = flag; else delete VC.remote[key];
    if (!VC.on) return;
    if (!flag) vcClosePeer(key);
    else if (!VC.peers[key] && vcStarter(key)) vcPeer(key);
  }
  async function vcJoin() {
    if (VC.on || VC.joining || A.mode !== 'online' || !A.connected) return;
    if (!window.RTCPeerConnection) { toast('這個瀏覽器不支援語音通話', 'bad'); return; }
    VC.joining = true;
    vcRender();
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) { VC.ctx = new Ctx(); if (VC.ctx.resume) VC.ctx.resume().catch(() => {}); }
    } catch (e) { VC.ctx = null; }
    VC.listenOnly = false;
    try {
      VC.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false });
    } catch (e) {
      VC.stream = null;
      VC.listenOnly = true;
      toast('沒有取得麥克風權限，你可以聽，但別人聽不到你', 'bad');
    }
    VC.joining = false;
    if (A.mode !== 'online' || !A.connected) {
      if (VC.stream) VC.stream.getTracks().forEach((t) => t.stop());
      vcLeave();
      return;
    }
    VC.on = true;
    VC.muted = false;
    if (VC.stream) {
      const stream = VC.stream;
      vcMeter(myKey(), stream);
      // 麥克風被拔掉或權限被收回時，改成只能聽，並告訴其他人
      stream.getAudioTracks().forEach((t) => {
        t.onended = () => {
          if (VC.stream !== stream || !VC.on) return;
          VC.listenOnly = true;
          toast('麥克風中斷了，別人聽不到你。可以先離開語音再重新加入。', 'bad');
          announce();
          vcRender();
        };
      });
      toast('已加入語音。建議戴耳機，可以避免回音。');
    }
    announce();
    Object.keys(VC.remote).forEach((k) => { if (vcStarter(k)) vcPeer(k); });
    if (!VC.timer) VC.timer = setInterval(vcTick, 150);
    vcRender();
  }
  // 手機切回這個頁面時，把被系統暫停的聲音接回來
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !VC.on) return;
    if (VC.ctx && VC.ctx.state !== 'running' && VC.ctx.resume) VC.ctx.resume().catch(() => {});
    Object.values(VC.peers).forEach((p) => { if (p.audio && p.audio.paused) p.audio.play().catch(() => {}); });
  });
  function vcLeave() {
    const was = VC.on;
    Object.keys(VC.peers).forEach((k) => { if (was) vcSig(k, VC.peers[k].sid, { bye: 1 }); vcClosePeer(k); });
    if (VC.stream) VC.stream.getTracks().forEach((t) => t.stop());
    VC.stream = null;
    Object.keys(VC.meters).forEach(vcDropMeter);
    if (VC.ctx) { try { VC.ctx.close(); } catch (e) { /* 略過 */ } }
    VC.ctx = null;
    clearInterval(VC.timer);
    VC.timer = null;
    VC.on = false; VC.joining = false; VC.muted = false; VC.listenOnly = false; VC.blocked = false;
    VC.talk = new Set();
    VC.heard = {};
    if (was && A.client && A.connected) announce();
    vcRender();
  }
  function vcMute() {
    if (!VC.on || VC.listenOnly) return;
    VC.muted = !VC.muted;
    if (VC.stream) VC.stream.getAudioTracks().forEach((t) => { t.enabled = !VC.muted; });
    announce();
    vcRender();
  }
  function vcUnblock() {
    if (VC.ctx && VC.ctx.resume) VC.ctx.resume().catch(() => {});
    Object.values(VC.peers).forEach((p) => { if (p.audio) p.audio.play().catch(() => {}); });
    VC.blocked = false;
    vcRender();
  }
  // 每 150 毫秒量一次音量，標出誰在說話；每秒檢查一次連線
  function vcTick() {
    const now = Date.now();
    Object.keys(VC.meters).forEach((k) => {
      const m = VC.meters[k];
      m.an.getByteTimeDomainData(m.buf);
      let sum = 0;
      for (let i = 0; i < m.buf.length; i++) { const x = (m.buf[i] - 128) / 128; sum += x * x; }
      const rms = Math.sqrt(sum / m.buf.length);
      const mutedSelf = k === myKey() && VC.muted;
      if (rms > 0.03 && !mutedSelf) VC.heard[k] = now;
    });
    const talk = new Set();
    Object.keys(VC.heard).forEach((k) => { if (now - VC.heard[k] < 450 && VC.meters[k]) talk.add(pidOfKey(k)); });
    VC.talk = talk;
    vcPaint();
    if (now - VC.watchAt > 1000) { VC.watchAt = now; vcWatch(now); }
  }
  function vcPaint() {
    for (const [pid, el] of A.tokEls) el.classList.toggle('talk', VC.talk.has(pid));
    document.querySelectorAll('[data-pid]').forEach((row) => {
      const a = row.querySelector('.av');
      if (a) a.classList.toggle('talk', VC.talk.has(row.dataset.pid));
    });
    const fab = $('#vfab');
    if (fab) fab.classList.toggle('talk', VC.talk.has(A.myPid));
  }
  // 玩家名單上的語音小圖示
  function vcBadge(pid) {
    if (A.mode !== 'online') return '';
    let flag = 0, failed = false;
    if (pid === A.myPid && VC.on) flag = VC.flag();
    vcLive().forEach((k) => {
      if (pidOfKey(k) !== pid) return;
      flag = Math.max(flag, VC.remote[k]);
      if (VC.peers[k] && VC.peers[k].state === 'failed') failed = true;
    });
    if (!flag) return '';
    const muted = flag === 2;
    return `<span class="vtag${muted ? ' off' : ''}" title="${muted ? '在語音裡，麥克風關著' : '在語音裡'}">${muted ? MIC_OFF : MIC}</span>` +
      (failed ? '<span class="tag red" title="你們之間的網路連不通，聽不到彼此，正在重試">語音連不上</span>' : '');
  }
  const vcLive = () => Object.keys(VC.remote).filter((k) => k in A.tabs);
  function vcCount() {
    const pids = new Set(vcLive().map(pidOfKey));
    if (VC.on) pids.add(A.myPid);
    return pids.size;
  }
  function vcTools() {
    const box = $('#vtools'), fab = $('#vfab');
    if (!box) return;
    const online = A.mode === 'online';
    box.hidden = !online;
    if (!online) { setHTML(box, ''); fab.hidden = true; document.body.classList.remove('vc'); return; }
    const n = vcCount();
    let h = '';
    if (VC.on) {
      h += `<button class="tbtn vbtn${VC.muted || VC.listenOnly ? ' off' : ' live'}" type="button" data-act="vcMute"${VC.listenOnly ? ' disabled' : ''}>${VC.muted || VC.listenOnly ? MIC_OFF : MIC}<span>${VC.listenOnly ? '只能聽' : VC.muted ? '已靜音' : '麥克風開'}</span></button>`;
      h += `<button class="tbtn" type="button" data-act="vcLeave">離開語音</button>`;
      if (VC.blocked) h += '<button class="tbtn gold" type="button" data-act="vcUnblock">點這裡開啟聲音</button>';
      h += `<span class="vcount">${n} 人在語音</span>`;
    } else {
      h += `<button class="tbtn vbtn join" type="button" data-act="vcJoin"${VC.joining || !A.connected ? ' disabled' : ''}>${MIC}<span>${VC.joining ? '連線中…' : '加入語音'}</span></button>`;
      if (n) h += `<span class="vcount">${n} 人在語音</span>`;
    }
    setHTML(box, h);
    fab.hidden = !VC.on;
    document.body.classList.toggle('vc', VC.on);
    if (VC.on) {
      setHTML(fab, VC.muted || VC.listenOnly ? MIC_OFF : MIC);
      fab.classList.toggle('off', VC.muted || VC.listenOnly);
      fab.setAttribute('aria-label', VC.listenOnly ? '沒有麥克風權限' : VC.muted ? '取消靜音' : '靜音');
      fab.disabled = VC.listenOnly;
    }
  }
  function vcRender() {
    vcTools();
    renderPax();
    renderLobby();
    vcPaint();
  }
  if (window.__GM_BROKERS) window.__VC = VC;

  function boot() {
    if (A.booted) return;
    A.booted = true;
    A.myPid = localToken();
    buildBoard();
    bindUI();
    A.mode = 'landing';
    renderAll();
    route();
    setInterval(housekeeping, 2000);
    if (window.__GM_BROKERS) window.__MM = { state: () => A.s, pid: () => A.myPid, app: A };
  }
  boot();
})();

</script>
