<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>环球大富翁</title>
<meta name="description" content="和朋友在线玩的世界城市大富翁。开个房间，把链接发给朋友，打开就能入座，不用注册。">
<meta property="og:title" content="环球大富翁">
<meta property="og:description" content="开个房间，把链接发给朋友，一起环游世界买地盖房。不用注册。">
<meta name="theme-color" content="#1F4F9E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%23D3283A'/%3E%3Ccircle cx='10.5' cy='10.5' r='2.6' fill='white'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='white'/%3E%3Ccircle cx='21.5' cy='21.5' r='2.6' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap" media="print" onload="this.media='all'">
<style>
/* 布局：航空信封红蓝斜纹框住的棋盘是主角；宽屏时右侧是登机牌式的玩家栏，窄屏时依次排在棋盘下方 */
:root {
  color-scheme: light;
  --paper: #EDF1F7;
  --surface: #FFFFFF;
  --surface-2: #E3E9F3;
  --surface-3: #F5F7FB;
  --ink: #141E36;
  --ink-2: #55617D;
  --ink-3: #8792AB;
  --line: #CAD2E0;
  --air-red: #D3283A;
  --air-blue: #1F4F9E;
  --gap-paper: #FFFFFF;
  --on-color: #FFFFFF;
  --good: #17784D;
  --warn: #A86300;
  --bad: #BF2630;
  --focus: #1F4F9E;
  --hatch: rgba(20, 30, 54, .17);
  --dot: rgba(20, 30, 54, .07);
  --shade: rgba(20, 30, 54, .22);
  --scrim: rgba(12, 18, 32, .48);
  --g1: #21968A; --g2: #D8603A; --g3: #7254C4; --g4: #C63A67;
  --g5: #A0760B; --g6: #2B80C2; --g7: #3D8737; --g8: #2A3876;
  --p1: #E8542F; --p2: #2C8BD6; --p3: #D99412; --p4: #2B9B63; --p5: #9054CF; --p6: #DB4C90;
  --f-display: "ZCOOL QingKe HuangYou", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --f-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0B1120; --surface: #141C30; --surface-2: #1A2440; --surface-3: #18213A;
    --ink: #E5EAF4; --ink-2: #9EA9C3; --ink-3: #6B7694; --line: #2A3657;
    --air-red: #FF5D6D; --air-blue: #7FA6FF; --gap-paper: #141C30;
    --good: #4CC28B; --warn: #F2A93B; --bad: #FF6B72; --focus: #7FA6FF;
    --hatch: rgba(229, 234, 244, .15); --dot: rgba(229, 234, 244, .05);
    --shade: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .62);
    --g8: #4255B0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0B1120; --surface: #141C30; --surface-2: #1A2440; --surface-3: #18213A;
  --ink: #E5EAF4; --ink-2: #9EA9C3; --ink-3: #6B7694; --line: #2A3657;
  --air-red: #FF5D6D; --air-blue: #7FA6FF; --gap-paper: #141C30;
  --good: #4CC28B; --warn: #F2A93B; --bad: #FF6B72; --focus: #7FA6FF;
  --hatch: rgba(229, 234, 244, .15); --dot: rgba(229, 234, 244, .05);
  --shade: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .62);
  --g8: #4255B0;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--paper); }
body { color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell {
  max-width: 1280px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
  display: flex; flex-direction: column; gap: 14px;
}

/* ---------- 顶栏 ---------- */
.topbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; letter-spacing: .02em; }
.brand h1 span { color: var(--air-red); }
.airmail {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font: 700 11px/1 var(--f-num); letter-spacing: .14em; color: var(--air-blue);
  border: 1.5px solid currentColor; border-radius: 3px; padding: 3px 7px; transform: rotate(-3deg);
}
.airmail b { font-family: var(--f-body); font-weight: 700; letter-spacing: .04em; color: var(--air-red); }
.conn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.conn.ok i { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
.conn.warn i { background: var(--warn); }
.tools { display: flex; gap: 8px; }
.tbtn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; min-height: 34px;
}
.tbtn:hover { border-color: var(--ink-3); }

.notice {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--surface); border: 1px dashed var(--ink-3); border-radius: 10px;
  padding: 10px 14px; font-size: 13px; color: var(--ink-2);
}
.notice b { color: var(--ink); font-weight: 600; flex: none; }

/* ---------- 主体布局 ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
@media (min-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr) 360px; } }
.board-col { min-width: 0; }

/* ---------- 棋盘 ---------- */
.board {
  position: relative; width: 100%; max-width: 780px; margin: 0 auto; aspect-ratio: 1 / 1;
  padding: clamp(5px, 1.3vw, 10px); border-radius: 6px;
  background: repeating-linear-gradient(-45deg, var(--air-red) 0 14px, var(--gap-paper) 14px 22px, var(--air-blue) 22px 36px, var(--gap-paper) 36px 44px);
  box-shadow: 0 22px 44px -26px var(--shade);
}
.grid {
  position: relative; width: 100%; height: 100%;
  display: grid; gap: 1px; background: var(--line); border-radius: 2px; overflow: hidden;
  grid-template-columns: 1.42fr repeat(7, 1fr) 1.42fr;
  grid-template-rows: 1.42fr repeat(7, 1fr) 1.42fr;
  container-type: inline-size; container-name: board;
}
.cell {
  position: relative; display: flex; min-width: 0; min-height: 0; overflow: hidden;
  background: var(--surface); cursor: pointer; outline: none;
}
.cell:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); z-index: 2; }
.cell:hover .nm { text-decoration: underline; text-decoration-color: var(--ink-3); text-underline-offset: 2px; }
.cell.b { flex-direction: column; }
.cell.t { flex-direction: column-reverse; }
.cell.l { flex-direction: row-reverse; }
.cell.r { flex-direction: row; }
.band {
  flex: none; display: flex; align-items: center; justify-content: center; gap: 2px; overflow: hidden;
  background: var(--gc, var(--ink-2)); color: var(--on-color);
}
.cell.b .band, .cell.t .band { height: 27%; }
.cell.l .band, .cell.r .band { width: 19%; flex-direction: column; }
.band.rail { --gc: var(--air-blue); }
.band.util { --gc: var(--ink-2); }
.code { font: 600 clamp(7px, 2.1cqi, 12px)/1 var(--f-num); letter-spacing: .08em; }
.cell.l .band .code, .cell.r .band .code, .band.has-h .code { display: none; }
.pips { display: flex; gap: clamp(1px, .4cqi, 3px); align-items: center; }
.cell.l .pips, .cell.r .pips { flex-direction: column; }
.pip { width: clamp(3px, .95cqi, 7px); height: clamp(3px, .95cqi, 7px); background: var(--on-color); border-radius: 1px; }
.pip.hotel { width: clamp(8px, 2.6cqi, 18px); height: clamp(4px, 1.2cqi, 8px); }
.cell.l .pip.hotel, .cell.r .pip.hotel { width: clamp(4px, 1.2cqi, 8px); height: clamp(8px, 2.6cqi, 18px); }
.body {
  flex: 1; min-width: 0; min-height: 0; padding: 1px 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15em; text-align: center;
}
.nm { font-size: clamp(9px, 2.7cqi, 15px); font-weight: 500; line-height: 1.12; white-space: nowrap; }
.pr { font: 500 clamp(8px, 2.3cqi, 13px)/1 var(--f-num); color: var(--ink-2); letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.code2 { font: 600 clamp(7px, 1.95cqi, 11px)/1 var(--f-num); letter-spacing: .09em; color: var(--ink-3); }
.cell.b .code2, .cell.t .code2 { display: none; }
.cell .code2.always { display: block; }
.short { display: none; }
@container board (max-width: 520px) { .full { display: none; } .short { display: inline; } }
.glyph { font: 400 clamp(16px, 5.4cqi, 32px)/1 var(--f-display); }
.glyph.red { color: var(--air-red); }
.glyph.blue { color: var(--air-blue); }

.cell[data-own]::after { content: ""; position: absolute; background: var(--oc); pointer-events: none; }
.cell.b[data-own]::after { left: 0; right: 0; bottom: 0; height: clamp(3px, .9cqi, 6px); }
.cell.t[data-own]::after { left: 0; right: 0; top: 0; height: clamp(3px, .9cqi, 6px); }
.cell.l[data-own]::after { top: 0; bottom: 0; left: 0; width: clamp(3px, .9cqi, 6px); }
.cell.r[data-own]::after { top: 0; bottom: 0; right: 0; width: clamp(3px, .9cqi, 6px); }
.cell.mort { background-image: repeating-linear-gradient(135deg, transparent 0 4px, var(--hatch) 4px 5px); }
.cell.mort .body { opacity: .5; }
.cell.offer { box-shadow: inset 0 0 0 2px var(--air-red); z-index: 1; }
.cell.flash { animation: flash .9s ease-out; }
@keyframes flash { 0% { box-shadow: inset 0 0 0 3px var(--air-blue); } 100% { box-shadow: inset 0 0 0 0 var(--air-blue); } }

/* 四个角 */
.corner { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3em; padding: 4px; text-align: center; }
.corner .nm { font-size: clamp(10px, 3cqi, 17px); font-weight: 700; }
.corner .sub { font-size: clamp(7.5px, 1.95cqi, 11px); line-height: 1.2; color: var(--ink-2); }
.stamp {
  font: 400 clamp(11px, 3.9cqi, 26px)/1 var(--f-display); padding: .18em .35em .12em; white-space: nowrap;
  border: 2px solid currentColor; border-radius: 4px;
}
@container board (max-width: 520px) {
  .park .sub, .jail .sub, .gojail .sub, .go .arrow { display: none; }
  .corner { gap: .2em; padding: 2px; }
}
.stamp.blue { color: var(--air-blue); transform: rotate(-6deg); }
.stamp.red { color: var(--air-red); transform: rotate(7deg); }
.go .arrow { font: 700 clamp(12px, 3.6cqi, 22px)/1 var(--f-num); color: var(--air-red); }
.jail .bars {
  width: 56%; height: 34%; border: 2px solid var(--ink-2); border-radius: 3px;
  background: repeating-linear-gradient(90deg, var(--ink-2) 0 2px, transparent 2px clamp(5px, 1.6cqi, 9px));
}
.park .pot { font: 700 clamp(13px, 3.8cqi, 24px)/1 var(--f-num); color: var(--good); font-variant-numeric: tabular-nums; }

/* 中央 */
.center {
  grid-row: 2 / 9; grid-column: 2 / 9; position: relative; min-width: 0; min-height: 0; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(5px, 1.7cqi, 14px);
  padding: clamp(8px, 3cqi, 28px); text-align: center;
  background-color: var(--surface-2);
  background-image: radial-gradient(var(--dot) 1.1px, transparent 1.4px);
  background-size: 14px 14px;
}
.c-logo { font: 400 clamp(20px, 7.4cqi, 50px)/1 var(--f-display); letter-spacing: .02em; }
.c-logo span { color: var(--air-red); }
@container board (max-width: 430px) { .c-logo { display: none; } }
.c-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: clamp(10px, 2.3cqi, 13px); color: var(--ink-2); }
.c-meta b { font: 600 1.15em/1 var(--f-num); color: var(--ink); font-variant-numeric: tabular-nums; }
.c-main { display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 1.4cqi, 10px); width: 100%; min-width: 0; }
.c-big { font: 400 clamp(22px, 7cqi, 44px)/1 var(--f-display); }
.c-sub, .c-wait { margin: 0; font-size: clamp(11px, 2.6cqi, 14px); color: var(--ink-2); }
.c-seats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.chip-tok {
  width: clamp(24px, 6.5cqi, 38px); height: clamp(24px, 6.5cqi, 38px); border-radius: 50%;
  display: grid; place-items: center; font-size: clamp(13px, 3.8cqi, 22px);
  background: var(--surface); box-shadow: 0 0 0 2px var(--pc);
}

.pass {
  width: min(100%, 380px); display: grid; grid-template-columns: auto minmax(0, 1fr); text-align: left;
  background: var(--surface); border-radius: 8px; overflow: hidden; box-shadow: 0 8px 20px -12px var(--shade);
}
.pass-stub { background: var(--pc); display: grid; place-items: center; padding: clamp(6px, 1.8cqi, 12px); }
.pass-tok {
  width: clamp(28px, 8cqi, 48px); height: clamp(28px, 8cqi, 48px); border-radius: 50%;
  display: grid; place-items: center; background: var(--surface); font-size: clamp(16px, 4.6cqi, 28px);
}
.pass-main { min-width: 0; padding: clamp(5px, 1.5cqi, 10px) clamp(8px, 2.2cqi, 14px); border-left: 2px dashed var(--line); display: grid; gap: 2px; }
.pass-label { font-size: clamp(9px, 2.1cqi, 12px); color: var(--ink-3); letter-spacing: .06em; }
.pass-label.me { color: var(--air-red); font-weight: 700; }
.pass-name { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 700; font-size: clamp(12px, 3.1cqi, 18px); line-height: 1.2; }
.pass-name > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pass-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.pass-cash { font: 600 clamp(14px, 3.6cqi, 22px)/1 var(--f-num); font-variant-numeric: tabular-nums; }
.pass-status { font-size: clamp(10px, 2.4cqi, 13px); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ticker {
  max-width: 100%; font-size: clamp(10px, 2.4cqi, 13px); color: var(--ink-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.dice { display: flex; gap: clamp(6px, 2cqi, 14px); }
.die {
  width: clamp(28px, 8.6cqi, 54px); height: clamp(28px, 8.6cqi, 54px); padding: 13%;
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  background: var(--surface); border-radius: 18%;
  box-shadow: inset 0 -2px 0 var(--line), 0 4px 10px -6px var(--shade);
}
.die i { border-radius: 50%; margin: 13%; background: var(--ink); visibility: hidden; }
.die i.on { visibility: visible; }
.die.red i.on { background: var(--air-red); }
.dice.rolling .die { animation: tumble .28s linear infinite; }
.dice.rolling .die:nth-child(2) { animation-direction: reverse; }
@keyframes tumble { 0% { transform: rotate(0) translateY(0); } 50% { transform: rotate(14deg) translateY(-3px); } 100% { transform: rotate(0) translateY(0); } }

.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(5px, 1.5cqi, 10px); min-height: 2px; }
.btn {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn.primary { background: var(--air-blue); border-color: transparent; color: var(--on-color); }
.btn.danger { background: var(--air-red); border-color: transparent; color: var(--on-color); }
.btn.small { min-height: 30px; padding: 0 10px; font-size: 13px; font-weight: 500; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn .mo { font-family: var(--f-num); font-weight: 600; letter-spacing: .02em; }
.center .btn { min-height: clamp(30px, 8cqi, 40px); font-size: clamp(12px, 3cqi, 15px); padding: 0 clamp(10px, 3cqi, 16px); }
:is(.btn, .tbtn, .seg button, .tk input, .prop-row, .linkish):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.busy-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }

.podium { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; width: min(100%, 320px); }
.podium li { display: grid; grid-template-columns: 22px auto minmax(0, 1fr) auto; align-items: center; gap: 8px; background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: clamp(11px, 2.7cqi, 14px); text-align: left; }
.podium .rk { font: 700 1.2em/1 var(--f-num); color: var(--ink-3); }
.podium li:first-child .rk { color: var(--air-red); }
.podium .nn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.podium .ww { font: 600 1.1em/1 var(--f-num); font-variant-numeric: tabular-nums; }
.podium .chip-tok { width: 24px; height: 24px; font-size: 13px; }

/* 棋子 */
.tokens { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.tok {
  position: absolute; left: 0; top: 0; width: var(--ts, 18px); height: var(--ts, 18px);
  margin: calc(var(--ts, 18px) / -2) 0 0 calc(var(--ts, 18px) / -2);
  border-radius: 50%; display: grid; place-items: center; background: var(--surface);
  box-shadow: 0 0 0 2px var(--pc), 0 3px 6px -2px var(--shade);
  font-size: calc(var(--ts, 18px) * .64); line-height: 1;
  transition: transform .16s ease-out;
}
.tok.cur { box-shadow: 0 0 0 2px var(--pc), 0 0 0 5px color-mix(in srgb, var(--pc) 30%, transparent), 0 3px 6px -2px var(--shade); z-index: 2; }
.tok.moving { z-index: 3; transition-duration: .12s; }
.tok.hop > span { animation: hop .2s ease-out; }
@keyframes hop { 50% { transform: translateY(-30%) scale(1.08); } }
.noanim .tok { transition: none; }
.floater {
  position: absolute; z-index: 5; pointer-events: none; white-space: nowrap;
  font: 700 clamp(11px, 2.8cqi, 17px)/1 var(--f-num); padding: 3px 6px; border-radius: 4px;
  background: var(--surface); color: var(--good); box-shadow: 0 3px 8px -3px var(--shade);
  animation: rise 1.6s ease-out forwards;
}
.floater.neg { color: var(--bad); }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, 0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -40px); } }

/* 机会 / 命运明信片 */
.postcard {
  position: absolute; left: 50%; top: 50%; z-index: 6; width: min(92%, 360px);
  transform: translate(-50%, -50%) rotate(-2deg);
  background: var(--surface); padding: clamp(10px, 3cqi, 18px); text-align: left; cursor: pointer;
  border: 6px solid transparent;
  border-image: repeating-linear-gradient(-45deg, var(--air-red) 0 8px, var(--gap-paper) 8px 12px, var(--air-blue) 12px 20px, var(--gap-paper) 20px 24px) 6;
  box-shadow: 0 26px 50px -18px var(--shade);
  animation: drop .32s ease-out;
}
@keyframes drop { from { opacity: 0; transform: translate(-50%, -60%) rotate(-8deg); } }
.pc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.pc-who { font-size: clamp(11px, 2.6cqi, 13px); color: var(--ink-2); }
.pc-stamp {
  font: 400 clamp(14px, 4cqi, 22px)/1 var(--f-display); padding: 6px 8px; flex: none;
  border: 2px dashed currentColor; border-radius: 3px; transform: rotate(4deg);
}
.pc-stamp.C { color: var(--air-red); }
.pc-stamp.F { color: var(--air-blue); }

      { x: '换汇赶上好汇率，赚了 $50。', e: 'gain', v: 50 },
      { x: '走错登机口，后退 3 格。', e: 'back', v: 3 },
      { x: '护照过期被边检拦下，直接入狱。', e: 'jail' },
      { x: '获得「免签通行证」，留着可以免费出狱。', e: 'card' },
      { x: '酒店集体翻新：每栋房屋付 $25，每家酒店付 $100。', e: 'fix', v: [25, 100] },
      { x: '行李超重，罚款 $15。', e: 'pay', v: 15 },
      { x: '当选旅行团团长，请大家喝咖啡：付给每位玩家 $50。', e: 'payall', v: 50 },
    ],
    F: [
      { x: '前往「起点」，领取 $200。', e: 'to', v: 0 },
      { x: '航班超售，拿到补偿 $200。', e: 'gain', v: 200 },
      { x: '水土不服看急诊，医药费 $50。', e: 'pay', v: 50 },
      { x: '老同学还钱，收到 $50。', e: 'gain', v: 50 },
      { x: '获得「免签通行证」，留着可以免费出狱。', e: 'card' },
      { x: '海关抽检出违禁品，直接入狱。', e: 'jail' },
      { x: '年终奖到账，收到 $100。', e: 'gain', v: 100 },
      { x: '购物退税成功，收到 $20。', e: 'gain', v: 20 },
      { x: '生日快乐！每位玩家送你 $10。', e: 'collect', v: 10 },
      { x: '旅行险理赔到账，收到 $100。', e: 'gain', v: 100 },
      { x: '民宿差评闹纠纷，赔偿 $100。', e: 'pay', v: 100 },
      { x: '城市维护费：每栋房屋付 $40，每家酒店付 $115。', e: 'fix', v: [40, 115] },
    ],
  };

  // ---------- 工具 ----------
  const clone = (o) => JSON.parse(JSON.stringify(o));
  function shuffle(a, rnd) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function rid(rnd) { let s = ''; for (let i = 0; i < 10; i++) s += 'abcdefghijkmnpqrstuvwxyz23456789'[Math.floor(rnd() * 32)]; return s; }
  function cleanNick(v) {
    const s = String(v == null ? '' : v)
      .replace(/[\u0000-\u001f\u007f-\u009f\u00ad\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g, '')
      .replace(/\s+/g, ' ').trim();
    return Array.from(s).slice(0, 10).join('');
  }
  function L(s, ...segs) {
    s.lc = (s.lc || 0) + 1;
    s.log.push({ k: s.lc, s: segs });
    if (s.log.length > LOG_MAX) s.log.splice(0, s.log.length - LOG_MAX);
  }
  const alive = (s) => s.ps.map((p, i) => i).filter((i) => !s.ps[i].out);
  const ownerOf = (s, q) => (s.own[q] ? s.own[q].o : -1);
  const groupHouses = (s, g) => GROUP[g].reduce((n, q) => n + (s.own[q] ? s.own[q].h : 0), 0);
  const ownsGroup = (s, i, g) => GROUP[g].every((q) => s.own[q] && s.own[q].o === i);
  const mortValue = (q) => SQ[q].p / 2;
  const unmortCost = (q) => Math.ceil(SQ[q].p / 2 * 1.1);
  const acqPrice = (q) => SQ[q].p * ACQ_RATE;
  // 收购：停在别人的城市上，而同色其余城市都归你，就可以按 2 倍地价买下它
  function canAcquire(s, i, q) {
    const sq = SQ[q], o = s.own[q];
    if (!sq || sq.t !== 'prop' || !o || o.o === i || o.h > 0) return false;
    return GROUP[sq.g].every((x) => x === q || (s.own[x] && s.own[x].o === i));
  }

  function netWorth(s, i) {
    let w = s.ps[i].cash;
    for (const k in s.own) {
      const o = s.own[k], q = +k;
      if (o.o !== i) continue;
      w += o.m ? SQ[q].p / 2 : SQ[q].p;
      if (o.h && SQ[q].g) w += o.h * HOUSE[SQ[q].g];
    }
    return w;
  }

  function rentOf(s, q, tot) {
    const sq = SQ[q], o = s.own[q];
    if (!o) return 0;
    if (sq.t === 'prop') {
      if (o.h > 0) return sq.r[o.h];
      return sq.r[0] * (ownsGroup(s, o.o, sq.g) ? 2 : 1);
    }
    if (sq.t === 'rail') {
      const n = RAILS.filter((r) => s.own[r] && s.own[r].o === o.o).length;
      return 25 * Math.pow(2, n - 1);
    }
    if (sq.t === 'util') {
      const n = UTILS.filter((u) => s.own[u] && s.own[u].o === o.o).length;
      return (tot || 7) * (n === 2 ? 10 : 4);
    }
    return 0;
  }

  // ---------- 牌桌 ----------
  function newTable(rnd) {
    rnd = rnd || Math.random;
    return {
      v: 1, ver: 0, st: 'lobby', gid: rid(rnd), ps: [], turn: 0, ph: 'roll',
      dice: [0, 0], rk: 0, dbl: 0, extra: false, own: {}, pot: 0, round: 1, maxR: 25,
      dk: { C: [], F: [] }, card: null, mv: null, pend: -1, log: [], lc: 0,
      starter: null, win: -1, rank: null, worth: null, seen: {}, rej: null, why: '',
    };
  }

  function newPlayer(s, id, nick, tok, bot) {
    const used = s.ps.map((p) => p.col);
    let col = 0; while (used.includes(col)) col++;
    return { id, nick, tok, bot: !!bot, auto: false, cash: 0, pos: 0, jail: false, jt: 0, cards: 0, out: false, outAt: 0, col };
  }

  function freeToken(s) {
    for (let t = 0; t < TOKENS.length; t++) if (!s.ps.some((p) => p.tok === t)) return t;
    return 0;
  }

  // ---------- 移动 ----------
  function pushMove(s, i, from, to, w) {
    if (!s.mv || s.mv.k !== s.ver || s.mv.p !== i) s.mv = { k: s.ver, p: i, from, path: [] };
    s.mv.path.push({ to, w });
  }
  function markCard(s, i) {
    if (s.mv && s.mv.k === s.ver && s.mv.p === i) s.mv.path.push({ c: 1 });
  }

  // 向前走 n 格，经过或停在起点领钱，然后结算落点
  function moveBy(s, i, n) {
    const P = s.ps[i];
    const from = P.pos, to = (from + n) % N;
    pushMove(s, i, from, to, 1);
    P.pos = to;
    if (from + n >= N) { P.cash += GO_PAY; L(s, { p: i }, ' 经过起点，领取 ', { m: GO_PAY }); }
    land(s, i);
  }
  function advanceTo(s, i, target) {
    const P = s.ps[i];
    let steps = (target - P.pos + N) % N;
    if (steps === 0) steps = N;
    L(s, { p: i }, ' 前往 ', { q: target });
    moveBy(s, i, steps);
  }
  function back(s, i, n) {
    const P = s.ps[i];
    const from = P.pos, to = (from - n + N) % N;
    pushMove(s, i, from, to, -1);
    P.pos = to;
    L(s, { p: i }, ' 后退到 ', { q: to });
    land(s, i);
  }
  function goJail(s, i) {
    const P = s.ps[i];
    pushMove(s, i, P.pos, JAIL, 0);
    P.pos = JAIL; P.jail = true; P.jt = 0;
    if (s.turn === i) { s.extra = false; s.dbl = 0; s.ph = 'end'; }
    L(s, { p: i }, ' 进了监狱');
  }

  // ---------- 付钱、变卖、破产 ----------
  function credit(s, to, amt) {
    if (to === 'pot') s.pot += amt;
    else if (typeof to === 'number' && s.ps[to] && !s.ps[to].out) s.ps[to].cash += amt;
  }

  // 现金不够时自动变卖：先抵押没盖房的地产（便宜的先），再卖房
  function liquidate(s, i, need) {
    const P = s.ps[i];
    let sold = 0, morts = 0, got = 0, guard = 200;
    while (P.cash < need && guard-- > 0) {
      let best = -1, bestV = Infinity;
      for (const k in s.own) {
        const o = s.own[k], q = +k;
        if (o.o !== i || o.m) continue;
        if (SQ[q].t === 'prop' && groupHouses(s, SQ[q].g) > 0) continue;
        if (mortValue(q) < bestV) { bestV = mortValue(q); best = q; }
      }
      if (best >= 0) { s.own[best].m = true; P.cash += bestV; got += bestV; morts++; continue; }
      let hq = -1;
      for (const k in s.own) {
        const o = s.own[k], q = +k;
        if (o.o !== i || !o.h) continue;
        if (hq < 0 || o.h > s.own[hq].h || (o.h === s.own[hq].h && HOUSE[SQ[q].g] < HOUSE[SQ[hq].g])) hq = q;
      }
      if (hq >= 0) { s.own[hq].h--; const r = HOUSE[SQ[hq].g] / 2; P.cash += r; got += r; sold++; continue; }
      break;
    }
    if (sold || morts) {
      const parts = [];
      if (sold) parts.push(`卖掉 ${sold} 栋房屋`);
      if (morts) parts.push(`抵押 ${morts} 处地产`);
      L(s, { p: i }, ` 现金不够，自动${parts.join('、')}，筹到 `, { m: got });
    }
  }

  // 返回 true 表示付清，false 表示破产
  function pay(s, i, amt, to) {
    const P = s.ps[i];
    if (P.out || amt <= 0) return !P.out;
    if (P.cash < amt) liquidate(s, i, amt);
    if (P.cash < amt) { bankrupt(s, i, to); return false; }
    P.cash -= amt;
    credit(s, to, amt);
    return true;
  }

  function bankrupt(s, i, to) {
    const P = s.ps[i];
    const cash = P.cash;
    P.cash = 0;
    if (typeof to === 'number' && s.ps[to] && !s.ps[to].out && to !== i) {
      const C = s.ps[to];
      C.cash += cash;
      C.cards += P.cards;
      for (const k in s.own) if (s.own[k].o === i) { s.own[k].o = to; s.own[k].h = 0; }
      L(s, { p: i }, ' 破产了，剩余资产全部归 ', { p: to });
    } else {
      if (to === 'pot') s.pot += cash;
      for (const k in s.own) if (s.own[k].o === i) delete s.own[k];
      L(s, { p: i }, ' 破产了，地产收归银行');
    }
    P.cards = 0; P.out = true; P.jail = false; P.jt = 0; P.auto = false; P.outAt = s.ver * 100 + i;
    if (s.turn === i) { s.extra = false; s.ph = 'end'; s.pend = -1; }
    if (alive(s).length <= 1) { finish(s, 'last'); return; }
    fixPending(s);
  }

  // 有人破产后，当前玩家待定的买地或收购可能已经失效
  function fixPending(s) {
    if (s.st !== 'play' || s.pend < 0 || s.ph !== 'acq') return;
    const i = s.turn, q = s.pend, P = s.ps[i];
    if (canAcquire(s, i, q)) return;
    if (!s.own[q]) { s.ph = 'buy'; return; }
    s.pend = -1;
    s.ph = s.extra && !P.jail ? 'roll' : 'end';
  }

  function finish(s, why) {
    if (s.st !== 'play') return;
    s.st = 'over'; s.ph = 'end'; s.pend = -1; s.why = why;
    const idx = s.ps.map((p, i) => i);
    const live = idx.filter((i) => !s.ps[i].out).sort((a, b) => netWorth(s, b) - netWorth(s, a));
    const dead = idx.filter((i) => s.ps[i].out).sort((a, b) => s.ps[b].outAt - s.ps[a].outAt);
    s.rank = live.concat(dead);
    s.win = s.rank[0];
    s.worth = s.ps.map((p, i) => netWorth(s, i));
    const lead = why === 'rounds' ? '回合数已到，按总资产结算。' : why === 'early' ? '提前结算，按总资产排名。' : '只剩最后一位玩家。';
    L(s, lead, { p: s.win }, ' 获胜！');
  }

  function nextTurn(s) {
    if (s.st !== 'play') return;
    const n = s.ps.length;
    let i = s.turn;
    for (let k = 0; k < n; k++) { i = (i + 1) % n; if (!s.ps[i].out) break; }
    if (i <= s.turn) {
      s.round++;
      if (s.maxR && s.round > s.maxR) { finish(s, 'rounds'); return; }
    }
    s.turn = i; s.ph = 'roll'; s.dbl = 0; s.extra = false; s.pend = -1;
  }

  // ---------- 落点 ----------
  function land(s, i) {
    const P = s.ps[i];
    if (P.out || s.st !== 'play') return;
    const q = P.pos, sq = SQ[q];
    switch (sq.t) {
      case 'park':
        if (s.pot > 0) { const g = s.pot; P.cash += g; s.pot = 0; L(s, { p: i }, ' 领走了旅行基金 ', { m: g }); }
        break;
      case 'gojail':
        goJail(s, i);
        break;
      case 'tax':
        L(s, { p: i }, ` 缴纳${sq.n} `, { m: sq.a });
        pay(s, i, sq.a, 'pot');
        break;
      case 'chance': case 'fate':
        drawCard(s, i, sq.t === 'chance' ? 'C' : 'F');
        break;
      case 'prop': case 'rail': case 'util': {
        const o = s.own[q];
        if (!o) { if (s.turn === i) { s.ph = 'buy'; s.pend = q; } return; }
        if (o.o === i) return;
        if (o.m) {
          L(s, ' ', { q }, ' 已抵押，免付租金');
          if (s.turn === i && canAcquire(s, i, q)) { s.ph = 'acq'; s.pend = q; }
          return;
        }
        const rent = rentOf(s, q, s.dice[0] + s.dice[1]);
        L(s, { p: i }, ' 向 ', { p: o.o }, ' 支付租金 ', { m: rent });
        if (pay(s, i, rent, o.o) && s.st === 'play' && s.turn === i && canAcquire(s, i, q)) { s.ph = 'acq'; s.pend = q; }
        break;
      }
      default: break;
    }
  }

  function drawCard(s, i, d) {
    const deck = s.dk[d];
    if (!deck || !deck.length) return;
    const ci = deck.shift(); deck.push(ci);
    const c = CARDS[d][ci];
    s.card = { d, i: ci, k: s.ver, p: i };
    markCard(s, i);
    L(s, { p: i }, d === 'C' ? ' 抽到机会：' : ' 抽到命运：', c.x);
    const P = s.ps[i];
    switch (c.e) {
      case 'to': advanceTo(s, i, c.v); break;
      case 'rail': {
        let best = 0, bs = 99;
        for (const r of RAILS) { const st = (r - P.pos + N) % N || N; if (st < bs) { bs = st; best = r; } }
        advanceTo(s, i, best);
        break;
      }
      case 'gain': P.cash += c.v; break;
      case 'pay': pay(s, i, c.v, 'pot'); break;
      case 'back': back(s, i, c.v); break;
      case 'jail': goJail(s, i); break;
      case 'card': P.cards++; break;
      case 'fix': {
        let houses = 0, hotels = 0;
        for (const k in s.own) { const o = s.own[k]; if (o.o !== i) continue; if (o.h === 5) hotels++; else houses += o.h; }
        const cost = houses * c.v[0] + hotels * c.v[1];
        if (cost > 0) { L(s, { p: i }, ` 有 ${houses} 栋房屋、${hotels} 家酒店，共付 `, { m: cost }); pay(s, i, cost, 'pot'); }
        else L(s, { p: i }, ' 名下没有房屋，不用付钱');
        break;
      }
      case 'payall':
        for (const j of alive(s)) { if (j === i) continue; if (!pay(s, i, c.v, j) || s.st !== 'play') break; }
        break;
      case 'collect':
        for (const j of alive(s)) { if (j === i) continue; pay(s, j, c.v, i); if (s.st !== 'play') break; }
        break;
      default: break;
    }
  }

  function settle(s, i) {
    if (s.st !== 'play') return;
    const P = s.ps[i];
    if (P.out || s.ph === 'buy' || s.ph === 'acq') return;
    s.ph = s.extra && !P.jail ? 'roll' : 'end';
  }

  function roll(s, i, rnd) {
    const P = s.ps[i];
    const d1 = 1 + Math.floor(rnd() * 6), d2 = 1 + Math.floor(rnd() * 6);
    const tot = d1 + d2, dbl = d1 === d2;
    s.dice = [d1, d2]; s.rk = s.ver; s.ph = 'moving';
    if (P.jail) {
      s.extra = false;
      if (dbl) {
        P.jail = false; P.jt = 0;
        L(s, { p: i }, ` 掷出 ${d1}+${d2}，双数出狱，来到 `, { q: (P.pos + tot) % N });
        moveBy(s, i, tot);
      } else if (P.jt >= 2) {
        L(s, { p: i }, ` 掷出 ${d1}+${d2}，第三次没出狱，缴纳保释金 `, { m: BAIL });
        if (!pay(s, i, BAIL, 'pot')) return;
        P.jail = false; P.jt = 0;
        L(s, { p: i }, ' 出狱，来到 ', { q: (P.pos + tot) % N });
        moveBy(s, i, tot);
      } else {
        P.jt++;
        L(s, { p: i }, ` 掷出 ${d1}+${d2}，没能出狱（第 ${P.jt} 次）`);
        s.ph = 'end';
        return;
      }
    } else {
      if (dbl) s.dbl++;
      if (dbl && s.dbl >= 3) {
        L(s, { p: i }, ` 掷出 ${d1}+${d2}，连续三次双数，超速被拦下`);
        goJail(s, i);
        return;
      }
      s.extra = dbl;
      L(s, { p: i }, ` 掷出 ${d1}+${d2}${dbl ? '（双数，可再掷）' : ''}，来到 `, { q: (P.pos + tot) % N });
      moveBy(s, i, tot);
    }
    settle(s, i);
  }

  // ---------- 建房、卖房、抵押 ----------
  function canBuild(s, i, q) {
    const sq = SQ[q], o = s.own[q];
    if (!sq || sq.t !== 'prop') return '只有城市可以盖房';
    if (!o || o.o !== i) return '这不是你的地产';
    if (o.h >= 5) return '已经盖到酒店了';
    for (const g of GROUP[sq.g]) {
      const go = s.own[g];
      if (!go || go.o !== i) return '集齐同色城市后才能盖房';
      if (go.m) return '同色城市有抵押，先赎回';
    }
    const minH = Math.min(...GROUP[sq.g].map((g) => s.own[g].h));
    if (o.h > minH) return '同色城市要轮流盖，先盖另一座';
    if (s.ps[i].cash < HOUSE[sq.g]) return '现金不够';
    return null;
  }
  function canSell(s, i, q) {
    const sq = SQ[q], o = s.own[q];
    if (!sq || sq.t !== 'prop' || !o || o.o !== i) return '这不是你的地产';
    if (!o.h) return '这里没有房屋';
    const maxH = Math.max(...GROUP[sq.g].map((g) => (s.own[g] ? s.own[g].h : 0)));
    if (o.h < maxH) return '同色城市要轮流卖，先卖房多的那座';
    return null;
  }
  function canMort(s, i, q) {
    const sq = SQ[q], o = s.own[q];
    if (!sq || !o || o.o !== i) return '这不是你的地产';
    if (o.m) return '已经抵押了';
    if (sq.t === 'prop' && groupHouses(s, sq.g) > 0) return '同色城市还有房屋，先卖房';
    return null;
  }
  function canUnmort(s, i, q) {
    const o = s.own[q];
    if (!o || o.o !== i) return '这不是你的地产';
    if (!o.m) return '没有抵押';
    if (s.ps[i].cash < unmortCost(q)) return '现金不够';
    return null;
  }

  // ---------- 开局与重开 ----------
  function startGame(s, pid, rnd) {
    shuffle(s.ps, rnd);
    for (const p of s.ps) { p.cash = START_CASH; p.pos = 0; p.jail = false; p.jt = 0; p.cards = 0; p.out = false; p.outAt = 0; p.auto = false; }
    Object.assign(s, {
      st: 'play', turn: 0, ph: 'roll', dbl: 0, extra: false, own: {}, pot: 0, round: 1,
      dk: { C: shuffle(CARDS.C.map((c, k) => k), rnd), F: shuffle(CARDS.F.map((c, k) => k), rnd) },
      card: null, mv: null, pend: -1, dice: [0, 0], rk: 0, win: -1, rank: null, worth: null, starter: pid, why: '',
      gid: rid(rnd), log: [],
    });
    L(s, `对局开始，共 ${s.ps.length} 位玩家。`, { p: 0 }, ' 先走。');
  }
  function resetTable(s, rnd) {
    for (const p of s.ps) { p.cash = 0; p.pos = 0; p.jail = false; p.jt = 0; p.cards = 0; p.out = false; p.outAt = 0; p.auto = false; }
    Object.assign(s, {
      st: 'lobby', turn: 0, ph: 'roll', dbl: 0, extra: false, own: {}, pot: 0, round: 1, dk: { C: [], F: [] },
      card: null, mv: null, pend: -1, dice: [0, 0], rk: 0, win: -1, rank: null, worth: null, starter: null, why: '',

      const sl = (SLOTS[Math.min(n, 6)] || SLOTS[1])[k] || [0, 0];
      const m = Math.min(W, H);
      return [L + W / 2 + sl[0] * m, T + H / 2 + sl[1] * m];
    }
    const horiz = side === 'b' || side === 't';
    const along = horiz ? W : H;
    const row = k < 3 ? 0 : 1;
    const inRow = row === 0 ? Math.min(n, 3) : n - 3;
    const idx = row === 0 ? k : k - 3;
    const step = Math.min(TS * 0.95, along * 0.32);
    const a = (idx - (inRow - 1) / 2) * step;
    const depth = TS * 0.55 + row * TS * 0.9;
    if (side === 'b') return [L + W / 2 + a, T + depth];
    if (side === 't') return [L + W / 2 + a, T + H - depth];
    if (side === 'l') return [L + W - depth, T + H / 2 + a];
    return [L + depth, T + H / 2 + a];
  }
  function tokenEl(p) {
    let el = A.tokEls.get(p.id);
    if (!el) {
      el = document.createElement('div');
      el.className = 'tok';
      el.appendChild(document.createElement('span'));
      $('#tokens').appendChild(el);
      A.tokEls.set(p.id, el);
    }
    el.style.setProperty('--pc', pc(p));
    el.firstChild.textContent = E.TOKENS[p.tok] || '';
    return el;
  }
  function boardPlayers(s) {
    if (!s) return [];
    return s.ps.filter((p) => !p.out);
  }
  function layoutTokens(s, skipId) {
    if (!s) return;
    sizeTokens();
    const list = boardPlayers(s);
    const keep = new Set(list.map((p) => p.id));
    for (const [id, el] of A.tokEls) if (!keep.has(id)) { el.remove(); A.tokEls.delete(id); }
    const groups = {};
    list.forEach((p) => {
      if (A.disp[p.id] == null) A.disp[p.id] = p.pos;
      if (p.id === skipId) return;
      (groups[A.disp[p.id]] = groups[A.disp[p.id]] || []).push(p);
    });
    const cur = s.st === 'play' ? s.ps[s.turn] : null;
    for (const q in groups) {
      const g = groups[q];
      g.forEach((p, k) => {
        const el = tokenEl(p);
        const [x, y] = slotXY(+q, k, g.length);
        el.style.transform = `translate(${x}px, ${y}px)`;
        el.classList.toggle('cur', !!cur && cur.id === p.id);
      });
    }
    if (skipId) {
      const p = list.find((x) => x.id === skipId);
      if (p) tokenEl(p).classList.toggle('cur', !!cur && cur.id === p.id);
    }
  }
  function moveTokTo(el, q) {
    const [x, y] = slotXY(q, 0, 1);
    el.style.transform = `translate(${x}px, ${y}px)`;
  }
  function hop(el) {
    el.classList.remove('hop');
    void el.offsetWidth;
    el.classList.add('hop');
  }
  function flashCell(q) {
    const c = cells[q];
    if (!c) return;
    c.classList.remove('flash');
    void c.offsetWidth;
    c.classList.add('flash');
  }
  function pathSteps(mv) {
    let cur = mv.from, n = 0;
    for (const seg of mv.path) {
      if (seg.c) continue;
      if (seg.w === 0) { n += 2; cur = seg.to; continue; }
      const d = seg.w === 1 ? (seg.to - cur + E.N) % E.N : (cur - seg.to + E.N) % E.N;
      n += d; cur = seg.to;
    }
    return n;
  }
  const stepMs = (n) => Math.max(70, Math.min(170, 1600 / Math.max(1, n)));
  function jobCost(job) {
    if (document.visibilityState === 'hidden') return 0;
    if (RM) return job.card ? CARD_MS : 0;
    let t = 0;
    if (job.roll) t += 720;
    if (job.mv) { const n = pathSteps(job.mv); t += n * stepMs(n) + 260; }
    if (job.card) t += CARD_MS + 150;
    return t;
  }
  async function rollDice(d, fast) {
    const dice = $('#dice');
    dice.hidden = false;
    if (RM || fast) { setDiceFaces(d); return; }
    dice.classList.add('rolling');
    const t0 = Date.now();
    while (Date.now() - t0 < 560) {
      setDie(0, 1 + Math.floor(Math.random() * 6));
      setDie(1, 1 + Math.floor(Math.random() * 6));
      await sleep(70);
    }
    dice.classList.remove('rolling');
    setDiceFaces(d);
    await sleep(140);
  }
  function showCard(card, s) {
    return new Promise((resolve) => {
      const c = E.CARDS[card.d] && E.CARDS[card.d][card.i];
      const p = s.ps[card.p];
      if (!c) { resolve(); return; }
      const box = $('#postcard');
      $('#pcWho').textContent = (p ? (E.TOKENS[p.tok] || '') + ' ' + p.nick : '') + ' 抽到一张卡';
      const st = $('#pcStamp');
      st.textContent = card.d === 'C' ? '机会' : '命运';
      st.className = 'pc-stamp ' + card.d;
      $('#pcText').textContent = c.x;
      box.hidden = false;
      let done = false;
      const finish = () => { if (done) return; done = true; box.hidden = true; box.removeEventListener('click', finish); resolve(); };
      box.addEventListener('click', finish);
      setTimeout(finish, CARD_MS);
    });
  }
  async function walk(mv, s, card) {
    const p = s.ps[mv.p];
    if (!p) return;
    const el = tokenEl(p);
    let cur = mv.from;
    A.disp[p.id] = cur;
    layoutTokens(A.s, p.id);
    moveTokTo(el, cur);
    el.classList.add('moving');
    const ms = stepMs(pathSteps(mv));
    for (const seg of mv.path) {
      if (seg.c) {
        if (card) await showCard(card, s);
        card = null;
        continue;
      }
      if (seg.w === 0) { cur = seg.to; moveTokTo(el, cur); hop(el); await sleep(300); continue; }
      while (cur !== seg.to) {
        cur = (cur + (seg.w === 1 ? 1 : -1) + E.N) % E.N;
        moveTokTo(el, cur); hop(el);
        await sleep(ms);
      }
    }
    if (card) await showCard(card, s);
    el.classList.remove('moving');
    A.disp[p.id] = cur;
    flashCell(cur);
  }
  function showDeltas(prev, s) {
    if (!prev || prev.gid !== s.gid || s.st !== 'play' || prev.st !== 'play') return;
    const grid = $('#grid');
    s.ps.forEach((p) => {
      const old = prev.ps.find((x) => x.id === p.id);
      if (!old) return;
      const d = p.cash - old.cash;
      if (!d) return;
      const q = A.disp[p.id] != null ? A.disp[p.id] : p.pos;
      const [x, y] = slotXY(q, 0, 1);
      const f = document.createElement('div');
      f.className = 'floater' + (d < 0 ? ' neg' : '');
      f.textContent = (d > 0 ? '+' : MINUS) + money(Math.abs(d));
      f.style.left = x + 'px';
      f.style.top = (y - TS) + 'px';
      grid.appendChild(f);
      setTimeout(() => f.remove(), 1700);
      const cashEl = document.querySelector(`.pax[data-id="${CSS.escape(p.id)}"] .pcash`);
      if (cashEl) { cashEl.classList.remove('bump'); void cashEl.offsetWidth; cashEl.classList.add('bump'); }
    });
  }
  function queueVisual(prev, ns) {
    const fresh = !A.visualReady || !prev || prev.gid !== ns.gid;
    if (fresh) {
      A.qRk = ns.rk; A.qMvK = ns.mv ? ns.mv.k : 0; A.qCardK = ns.card ? ns.card.k : 0;
      A.disp = {};
      ns.ps.forEach((p) => { A.disp[p.id] = p.pos; });
      setDiceFaces(ns.dice);
      if (A.vqLen === 0) layoutTokens(ns);
      A.visualReady = true;
      return;
    }
    const job = {
      prev, s: ns,
      roll: ns.rk > 0 && ns.rk !== A.qRk,
      mv: ns.mv && ns.mv.k > A.qMvK ? ns.mv : null,
      card: ns.card && ns.card.k > A.qCardK ? ns.card : null,
    };
    A.qRk = ns.rk;
    if (ns.mv) A.qMvK = Math.max(A.qMvK, ns.mv.k);
    if (ns.card) A.qCardK = Math.max(A.qCardK, ns.card.k);
    const cost = jobCost(job);
    A.visualBusyUntil = Math.max(A.visualBusyUntil, Date.now()) + cost;
    A.vqLen++;
    const fast = A.vqLen > 3 || document.visibilityState === 'hidden';
    A.vq = A.vq.then(() => runVisual(job, fast)).catch((e) => console.warn(e)).then(() => {
      A.vqLen--;
      if (A.vqLen === 0) { A.visualBusyUntil = Math.min(A.visualBusyUntil, Date.now()); layoutTokens(A.s); }
      renderCenter();
      if (A.deedQ >= 0) renderDeed();
      scheduleBot();
    });
  }
  async function runVisual(job, fast) {
    const s = job.s;
    if (job.roll) await rollDice(s.dice, fast);
    else setDiceFaces(s.dice);
    if (job.mv && !fast && !RM) await walk(job.mv, s, job.card);
    else if (job.card && !fast) await showCard(job.card, s);
    s.ps.forEach((p) => { A.disp[p.id] = p.pos; });
    layoutTokens(A.s || s);
    if (!fast) showDeltas(job.prev, s);
  }

  function renderDeed() {
    const q = A.deedQ, s = A.s;

      body += `<div class="facts"><span>抵押可得<br><b>${money(E.mortValue(q))}</b></span><span>赎回需付<br><b>${money(E.unmortCost(q))}</b></span></div>`;

      const ok = myTurn && canSend() && !A.pending && A.vqLen === 0;
      const btn = (act, label, err) => `<button class="btn small${act === 'build' ? ' primary' : ''}" type="button" data-act="${act}" data-q="${q}"${!ok || err ? ' disabled' : ''}>${label}</button>`;

      if (sq.t === 'prop') {

      else { const em = E.canMort(s, me, q); parts.push(btn('mort', `抵押 <span class="mo">+${money(E.mortValue(q))}</span>`, em)); if (em && o.h === 0) reasons.push(em); }

      `<div class="deed-body">${body}<button class="btn sheet-close" type="button" data-act="close-sheet">关闭</button></div>`;
  }

  // ---------- 状态更新 ----------
  function setState(ns) {
    const prev = A.s;
    A.s = ns;
    A.lastStateAt = Date.now();
    if (A.pending && A.mode === 'online') {
      const seen = (ns.seen && ns.seen[A.myPid]) || 0;
      if (seen >= A.pending.n) {
        if (ns.rej && ns.rej.pid === A.myPid && ns.rej.n === A.pending.n) toast(ns.rej.m, 'bad');
        A.pending = null;
      }
    }
    if (A.mode === 'online' && ns.seen && A.myPid) A.sentN = Math.max(A.sentN, ns.seen[A.myPid] || 0);
    if (!ns.st || ns.st !== 'play') A.confirm = null;
    recomputePresence();
    queueVisual(prev, ns);
    renderAll();
    scheduleBot();
  }

  // 主持人：把一位玩家的操作应用到牌桌，再发给所有人
  function sanitizeAct(a) {
    const out = { t: typeof a.t === 'string' ? a.t.slice(0, 16) : '' };
    if (Number.isInteger(a.q)) out.q = a.q;
    if (Number.isInteger(a.i)) out.i = a.i;
    if (Number.isInteger(a.tok)) out.tok = a.tok;
    if (Number.isInteger(a.maxR)) out.maxR = a.maxR;
    if (typeof a.on === 'boolean') out.on = a.on;
    if (typeof a.nick === 'string') out.nick = a.nick.slice(0, 40);
    return out;
  }
  function hostProcess(pid, act) {
    const s = A.s;
    if (!s || !isHostNow()) return;
    if (!act || !Number.isInteger(act.n) || act.n <= ((s.seen && s.seen[pid]) || 0)) return;
    const r = E.apply(s, pid, sanitizeAct(act));
    const ns = r.ok ? r.s : E.clone(s);
    if (!r.ok) ns.ver = s.ver + 1;
    ns.seen = Object.assign({}, ns.seen, { [pid]: act.n });
    if (!r.ok) ns.rej = { pid, n: act.n, m: r.err };
    commit(ns);
  }
  function commit(ns) {
    setState(ns);
    if (A.mode === 'online') publishState(ns);
  }
  function publishState(ns) {
    if (!A.client || !isHostNow()) return;
    A.client.publish(topic('state'), JSON.stringify(ns), { qos: 1, retain: true }, (err) => {
      if (err) console.warn('发布牌桌失败', err);
    });
  }
  function createTable() {
    if (A.mode !== 'online' || !A.client) return;
    const s = E.newTable();
    s.ver = 1;
    s.host = A.myPid;
    s.tid = randId();
    A.noTable = false;
    A.synced = true;
    commit(s);
  }

  // ---------- 电脑代打 ----------
  function scheduleBot() {
    if (A.botTimer) return;
    const s = A.s;
    if (!s || s.st !== 'play') return;
    if (A.mode !== 'local' && !isHostNow()) return;
    const cur = s.ps[s.turn];
    if (!needsAuto(cur)) return;
    const wait = Math.max(750, A.visualBusyUntil - Date.now() + 450);
    A.botReadyAt = Date.now() + wait;
    A.botTimer = setTimeout(() => { A.botTimer = null; botTick(); }, wait);
  }
  // 后台标签页的定时器会被浏览器放慢，所以主持人收到别人的消息时也会推进电脑回合
  function maybeBot() {
    const s = A.s;
    if (!s || s.st !== 'play') return;
    if (A.mode !== 'local' && !isHostNow()) return;
    if (!needsAuto(s.ps[s.turn])) return;
    if (A.vqLen > 0 || Date.now() < A.botReadyAt) return;
    clearTimeout(A.botTimer);
    A.botTimer = null;
    botTick();
  }
  function botTick() {
    const s = A.s;
    if (!s || s.st !== 'play') return;
    if (A.mode !== 'local' && !isHostNow()) return;
    const cur = s.ps[s.turn];
    if (!needsAuto(cur)) return;
    if (Date.now() < A.visualBusyUntil || A.vqLen > 0) { scheduleBot(); return; }
    const a = E.botAct(s);
    if (!a) return;
    let r = E.apply(s, cur.id, a);
    if (!r.ok) r = E.apply(s, cur.id, { t: s.ph === 'roll' ? 'roll' : s.ph === 'end' ? 'end' : 'pass' });
    if (r.ok) commit(r.s);
  }

  // ---------- 在线状态与主持人 ----------
  const SAFE_ID = /^[A-Za-z0-9_-]{1,40}$/;
  function topic(k) { return `${TOPIC_ROOT}/${A.room}/${k}`; }
  function announce() {
    if (!A.client || !A.connected) return;
    A.lastAnnounce = Date.now();
    A.client.publish(topic(`who/${A.myPid}/${A.tab}`), JSON.stringify({ v: 1 }), { qos: 1, retain: true });
  }
  function onWho(pid, tab, txt) {
    if (!SAFE_ID.test(pid) || !SAFE_ID.test(tab)) return;
    const key = pid + '/' + tab;
    if (!txt) delete A.tabs[key];
    else A.tabs[key] = { pid, at: Date.now() };
    recomputePresence();
    trackAbsence();
    checkHost();
    renderTop(); renderNotice(); renderPax(); renderLobby(); renderCenter();
  }
  function recomputePresence() {
    const now = Date.now(), set = new Set();
    for (const k in A.tabs) {
      if (now - A.tabs[k].at < PRESENCE_TTL) set.add(A.tabs[k].pid);
      else delete A.tabs[k];
    }
    if (A.mode === 'online' && A.connected) set.add(A.myPid);
    A.presentPids = set;
    A.hostPid = A.s && A.s.host ? A.s.host : null;
    A.hostOnline = !!(A.hostPid && set.has(A.hostPid));
  }
  function trackAbsence() {
    const s = A.s;
    if (A.mode !== 'online' || !s) return;
    const now = Date.now();
    s.ps.forEach((p) => {
      if (p.bot || p.out) return;
      if (A.presentPids.has(p.id)) delete A.absentSince[p.id];
      else if (!A.absentSince[p.id]) A.absentSince[p.id] = now;
    });
  }
  // 主持人离线太久时，由在线的已入座玩家里编号最小的一位接手
  function checkHost() {
    const s = A.s;
    if (A.mode !== 'online' || !A.connected || !A.synced || !s) return;
    if (s.host === A.myPid || (s.host && A.presentPids.has(s.host))) { A.hostGoneAt = 0; return; }
    if (!A.hostGoneAt) { A.hostGoneAt = Date.now(); return; }
    if (Date.now() - A.hostGoneAt < HOST_GONE_MS) return;
    const online = [...A.presentPids].sort();
    const seated = online.filter((pid) => s.ps.some((p) => p.id === pid && !p.bot && !p.out));
    const pick = (seated.length ? seated : online)[0];
    if (pick !== A.myPid) return;
    const ns = E.clone(s);
    ns.ver = s.ver + 1;
    ns.host = A.myPid;
    const me = ns.ps.find((p) => p.id === A.myPid);
    E.log(ns, (me ? me.nick : '一位旁观者') + ' 接手主持牌桌');
    A.hostGoneAt = 0;
    commit(ns);
    announce();
  }

  function housekeeping() {
    const s = A.s;
    recomputePresence();
    trackAbsence();
    checkHost();
    if (A.mode === 'online' && A.connected && Date.now() - A.lastAnnounce > 20000) announce();
    if (isHostNow()) maybeBot();
    // 电脑回合时，前台页面定期提醒主持人，切到后台的主持人页面也能及时推进
    if (A.mode === 'online' && A.client && A.connected && !isHostNow() && s && s.st === 'play' && document.visibilityState === 'visible') {
      const cur = s.ps[s.turn];
      if (cur && (cur.bot || cur.auto || !A.presentPids.has(cur.id)) && Date.now() - A.lastStateAt > 2500 && Date.now() - A.lastTick > 2500) {
        A.lastTick = Date.now();
        A.client.publish(topic('act'), JSON.stringify({ pid: A.myPid, tick: 1 }), { qos: 0 });
      }
    }
    if (A.pending && Date.now() - A.pending.at > 15000) {
      A.pending = null;
      toast('主持人没有回应，请稍后再试', 'bad');
      renderAll();
    }
    renderTop();
    renderNotice();
    scheduleBot();
  }

  // ---------- 发送操作 ----------
  function submit(a) {
    if (A.mode === 'local') { submitLocal(a); return; }
    if (A.mode !== 'online') return;
    const s = A.s;
    if (!s || A.pending) return;
    const n = Math.max(A.sentN, (s.seen && s.seen[A.myPid]) || 0) + 1;
    A.sentN = n;
    const act = Object.assign({}, a, { n, pid: A.myPid });
    A.pending = { n, at: Date.now() };
    if (isHostNow()) { hostProcess(A.myPid, act); return; }
    if (!A.client || !A.connected) { A.pending = null; toast('还没连上服务器，请稍等', 'bad'); return; }
    A.client.publish(topic('act'), JSON.stringify(act), { qos: 1 }, (err) => {
      if (err && A.pending && A.pending.n === n) { A.pending = null; toast('操作没有发出去，请再试一次', 'bad'); renderAll(); }
    });
    renderAll();
  }
  function submitLocal(a) {
    const s = A.s;
    if (!s) return;
    let actor = A.myPid;
    if (s.st === 'play') {
      const me = meIdx(s);
      if (me >= 0) actor = s.ps[me].id;
    }
    if (a.t === 'addLocal') { actor = 'local-' + randId(); a = { t: 'join', nick: a.nick, tok: a.tok }; }
    const r = E.apply(s, actor, a);
    if (!r.ok) { toast(r.err, 'bad'); return; }
    commit(r.s);
  }

  // ---------- 房间连接 ----------
  function onMessage(t, buf) {
    const base = `${TOPIC_ROOT}/${A.room}/`;
    if (!t.startsWith(base)) return;
    const rest = t.slice(base.length);
    let txt = '';
    try { txt = buf && buf.length ? new TextDecoder().decode(buf) : ''; } catch (e) { return; }
    if (rest === 'state') {
      if (!txt) return;
      let d;
      try { d = JSON.parse(txt); } catch (e) { return; }
      onState(d);
      return;
    }
    if (rest === 'act') {
      let a;
      try { a = JSON.parse(txt); } catch (e) { return; }
      onAct(a);
      return;
    }
    if (rest.startsWith('who/')) {
      const parts = rest.split('/');
      if (parts.length === 3) onWho(parts[1], parts[2], txt);
    }
  }
  function onState(d) {
    if (!d || typeof d !== 'object' || !Array.isArray(d.ps) || d.v !== 1 || !Number.isInteger(d.ver)) return;
    A.synced = true;
    A.noTable = false;
    clearTimeout(A.syncTimer);
    const cur = A.s;
    if (cur && cur.tid === d.tid && d.ver <= cur.ver) {
      // 两个页面同时以为自己在主持时，编号小的那位优先，另一位让出
      if (isHostNow() && d.host && d.host !== A.myPid && d.host < A.myPid) setState(d);
      return;
    }
    setState(d);
  }
  function onAct(a) {
    if (!a || typeof a !== 'object' || typeof a.pid !== 'string' || !SAFE_ID.test(a.pid)) return;
    if (!isHostNow()) return;
    if (a.tick) { maybeBot(); return; }
    hostProcess(a.pid, a);
  }
  function clearTokens() {
    for (const el of A.tokEls.values()) el.remove();
    A.tokEls.clear();
    A.disp = {};
  }
  function resetRoomState() {
    A.s = null; A.synced = false; A.noTable = false; A.connected = false; A.tabs = {};
    A.presentPids = new Set(); A.hostOnline = false; A.hostPid = null; A.pending = null; A.sentN = 0;
    A.hostGoneAt = 0; A.visualReady = false; A.absentSince = {}; A.lastLogK = 0; A.confirm = null;
    clearTimeout(A.botTimer); A.botTimer = null;
    closeDeed();
    clearTokens();
  }
  function leaveRoom() {
    const c = A.client;
    A.client = null;
    clearTimeout(A.syncTimer);
    if (c) {
      try { if (c.connected) c.publish(topic(`who/${A.myPid}/${A.tab}`), '', { qos: 0, retain: true }); } catch (e) { /* 忽略 */ }
      try { c.end(false); } catch (e) { /* 忽略 */ }
    }
    A.connected = false;
  }
  function connectRoom(room, bIdx, creating) {
    leaveRoom();
    resetRoomState();
    A.mode = 'online';
    A.room = room;
    A.broker = bIdx;
    A.creating = !!creating;
    A.connStart = Date.now();
    renderAll();
    if (!window.mqtt) { A.libMissing = true; renderAll(); return; }
    const client = window.mqtt.connect(BROKERS[bIdx], {
      clientId: 'gm_' + randId(), clean: true, keepalive: 30, reconnectPeriod: 2500, connectTimeout: 12000,
      will: { topic: topic(`who/${A.myPid}/${A.tab}`), payload: '', retain: true, qos: 1 },
    });
    A.client = client;
    client.on('connect', () => {
      if (A.client !== client) return;
      A.connected = true;
      A.connLostAt = 0;
      client.subscribe([topic('state'), topic('act'), topic('who/+/+')], { qos: 1 }, (err) => {
        if (A.client !== client) return;
        if (err) { toast('进入房间失败，请刷新再试', 'bad'); return; }
        announce();
        if (!A.synced) {
          clearTimeout(A.syncTimer);
          A.syncTimer = setTimeout(() => {
            if (A.client !== client || A.synced) return;
            A.synced = true;
            if (!A.s) { A.noTable = true; if (A.creating) createTable(); }
            renderAll();
          }, 2500);
        }
      });
      recomputePresence();
      renderAll();
    });
    client.on('message', (t, buf) => { if (A.client === client) onMessage(t, buf); });
    client.on('close', () => {
      if (A.client !== client) return;
      if (A.connected) A.connLostAt = Date.now();
      A.connected = false;
      recomputePresence();
      renderTop(); renderNotice(); renderCenter();
    });
    client.on('error', (e) => console.warn('实时连接出错', e && e.message));
    // 创建房间时，首选服务器连不上就换下一个
    if (creating && bIdx + 1 < BROKERS.length) {
      setTimeout(() => {
        if (A.client === client && !A.connected && !A.s) {
          const next = bIdx + 1;
          A.pendingCreate = room;
          location.hash = roomHash(room, next);
        }
      }, 9000);
    }
  }
  function roomHash(room, b) { return 'r=' + room + (b ? '&b=' + b : ''); }
  function parseHash() {
    const p = new URLSearchParams(location.hash.replace(/^#/, ''));
    const room = (p.get('r') || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12);
    let b = parseInt(p.get('b') || '0', 10);
    if (!(b >= 0 && b < BROKERS.length)) b = 0;
    return { room: room.length >= 4 ? room : null, broker: b };
  }
  function inviteLink() {
    return location.origin + location.pathname + '#' + roomHash(A.room, A.broker);
  }
  function route() {
    const { room, broker } = parseHash();
    if (room) {
      if (A.mode === 'online' && A.room === room && A.broker === broker) return;
      const creating = A.pendingCreate === room;
      A.pendingCreate = null;
      connectRoom(room, broker, creating);
    } else if (A.mode !== 'local') {
      goLanding();
    }
  }
  function newRoomCode() {
    const abc = 'abcdefghjkmnpqrstuvwxyz23456789';
    let c = '';
    const buf = new Uint32Array(7);
    (window.crypto || window.msCrypto).getRandomValues(buf);
    buf.forEach((v) => { c += abc[v % abc.length]; });
    return c;
  }
  function createRoom() {
    if (!window.mqtt) { toast('实时连接组件没有加载成功，请刷新页面', 'bad'); return; }
    const code = newRoomCode();
    A.pendingCreate = code;
    location.hash = roomHash(code, 0);
  }
  function goLanding() {
    leaveRoom();
    resetRoomState();
    A.mode = 'landing';
    A.room = null;
    renderAll();
  }

  // ---------- 启动 ----------
  function startLocal(data) {
    leaveRoom();
    resetRoomState();
    A.mode = 'local';
    A.room = null;
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    const saved = data && data.local;
    setState(saved && Array.isArray(saved.ps) && saved.v === 1 ? saved : E.newTable());
  }
  function boot() {
    if (A.booted) return;
    A.booted = true;
    A.myPid = localToken();
    buildBoard();
    bindUI();
    const savedNick = store.get('globe-mono.nick');
    if (savedNick) $('#nick').value = savedNick;
    A.mode = 'landing';
    renderAll();
    window.addEventListener('hashchange', route);
    route();
    setInterval(housekeeping, 2000);
    window.addEventListener('pagehide', () => {
      if (A.client && A.connected) {
        try { A.client.publish(topic(`who/${A.myPid}/${A.tab}`), '', { qos: 0, retain: true }); } catch (e) { /* 忽略 */ }
      }
    });
  }

  // ---------- 交互 ----------
  function bindUI() {
    document.addEventListener('click', (ev) => {
      const t = ev.target.closest('[data-act]');
      if (t && !t.disabled) { handleAct(t.dataset.act, t, ev); return; }
      const cell = ev.target.closest('.cell');
      if (cell) openDeed(+cell.dataset.q);
    });
    document.addEventListener('submit', (ev) => {
      if (ev.target.id !== 'joinRoomForm') return;
      ev.preventDefault();
      const code = String($('#roomCode').value || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12);
      if (code.length < 4) { toast('房间号不对，请检查一下', 'bad'); return; }
      location.hash = roomHash(code, 0);
    });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') { if (!$('#sheetBg').hidden) closeDeed(); if (!$('#dlgBg').hidden) closeDlg(); return; }
      if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('cell')) {
        ev.preventDefault();
        openDeed(+ev.target.dataset.q);
      }
    });
    $('#sheetBg').addEventListener('click', (ev) => { if (ev.target.id === 'sheetBg') closeDeed(); });
    $('#dlgBg').addEventListener('click', (ev) => { if (ev.target.id === 'dlgBg') closeDlg(); });
    $('#joinForm').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const nick = E.cleanNick($('#nick').value);
      if (!nick) { toast('请先填写昵称', 'bad'); $('#nick').focus(); return; }
      store.set('globe-mono.nick', nick);
      $('#nick').dataset.touched = '';
      A.tokTouched = false;
      submit({ t: 'join', nick, tok: selectedTok() });
    });
    $('#nick').addEventListener('input', () => { $('#nick').dataset.touched = '1'; });
    $('#tkrow').addEventListener('change', () => { A.tokTouched = true; });
    const grid = $('#grid');
    if (window.ResizeObserver) {
      new ResizeObserver(() => {
        grid.classList.add('noanim');
        if (A.vqLen === 0) layoutTokens(A.s);
        requestAnimationFrame(() => grid.classList.remove('noanim'));
      }).observe(grid);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && A.mode === 'online') { announce(); housekeeping(); }
    });
  }
  function selectedTok() {
    const el = document.querySelector('#tkrow input:checked');
    return el ? +el.value : 0;
  }
  function copyLink() {
    const link = inviteLink();
    const inp = $('#inviteLink');
    const fallback = () => { if (inp) { inp.focus(); inp.select(); } toast('请手动复制上面的链接'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(() => toast('链接已复制，发给朋友吧'), fallback);
    } else fallback();
  }
  function shareLink() {
    if (!navigator.share) { copyLink(); return; }
    navigator.share({ title: '环球大富翁', text: '来和我玩环球大富翁，打开链接就能入座：', url: inviteLink() }).catch(() => {});
  }
  function handleAct(act, el) {
    switch (act) {
      case 'rules': case 'invite': openDlg(act); return;
      case 'close-dlg': closeDlg(); return;
      case 'close-sheet': closeDeed(); return;
      case 'deed': openDeed(+el.dataset.q); return;
      case 'createRoom': createRoom(); return;
      case 'createHere': A.creating = true; createTable(); return;
      case 'playLocal': startLocal({}); return;
      case 'leaveRoom':
        if (A.mode === 'local') { goLanding(); return; }
        history.replaceState(null, '', location.pathname + location.search);
        goLanding();
        return;
      case 'copyLink': copyLink(); return;
      case 'shareLink': shareLink(); return;
      case 'retry': if (A.room) connectRoom(A.room, A.broker, A.creating); return;
      case 'cfg': submit({ t: 'cfg', maxR: +el.dataset.v }); return;
      case 'kick': submit({ t: 'kick', i: +el.dataset.i }); return;
      case 'addLocal': {
        const nick = E.cleanNick($('#nick').value);
        if (!nick) { toast('请先填写这位玩家的昵称', 'bad'); return; }
        submitLocal({ t: 'addLocal', nick, tok: selectedTok() });
        $('#nick').value = '';
        return;
      }
      case 'auto': submit({ t: 'auto', on: !!el.checked }); return;
      case 'resign': case 'endGame': A.confirm = act; renderMine(); return;
      case 'cancel': A.confirm = null; renderMine(); return;
      case 'resign-yes': A.confirm = null; submit({ t: 'resign' }); return;
      case 'endGame-yes': A.confirm = null; submit({ t: 'endGame' }); return;
      case 'build': case 'sell': case 'mort': case 'unmort': submit({ t: act, q: +el.dataset.q }); return;
      default: submit({ t: act });
    }
  }

  boot();
})();
</script>
</body>
</html>
